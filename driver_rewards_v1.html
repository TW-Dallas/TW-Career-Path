<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Rewards</title>
    <style>
        /* --- BRANDING --- */
        @font-face { font-family: 'PizzaPress'; src: url('fonts/Dominos Sans Header 1.ttf') format('truetype'); }
        @font-face { font-family: 'OneDotCd-Bold'; src: url('fonts/Dominos Sans Bold.ttf') format('truetype'); }
        @font-face { font-family: 'OneDotCd'; src: url('fonts/Dominos Sans Body.ttf') format('truetype'); }

        :root {
            --brand-blue: #0090e2; --brand-red: #ff0000; --acc-blue: #0077bd;
            --off-white: #faf2e9; --text-dark: #472b10; 
        }

        * { box-sizing: border-box; }
        body { font-family: 'OneDotCd', sans-serif; background-color: var(--brand-blue); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }

        /* Mobile Container */
        .app-container {
            background-color: white; width: 100%; max-width: 480px; 
            display: flex; flex-direction: column; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); min-height: 100dvh; 
            position: relative; z-index: 1;
        }

        /* Header */
        header { background-color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--brand-red); }
        .logo { max-width: 220px; height: auto; margin-bottom: 5px; }
        h1 { font-family: 'PizzaPress'; margin: 0; color: var(--brand-blue); font-size: 1.4rem; text-transform: uppercase; }

        /* Main Body */
        main { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }

        /* Inputs */
        label { font-family: 'OneDotCd-Bold'; color: var(--brand-blue); font-size: 1.1rem; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #ccc; border-radius: 8px; background: var(--off-white); font-family: 'OneDotCd'; margin-bottom: 15px; }
        .btn-main { background-color: var(--brand-red); color: white; width: 100%; padding: 15px; font-size: 1.2rem; border: none; border-radius: 8px; font-family: 'PizzaPress'; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #990000; }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        /* Results Card */
        .results-card { background-color: var(--off-white); border: 2px solid var(--brand-blue); border-radius: 10px; padding: 20px; text-align: center; display: none; margin-top: 10px; }
        .points-value { font-family: 'PizzaPress'; font-size: 4rem; color: var(--brand-blue); line-height: 1; margin: 10px 0; }
        .prize-btn { display: block; background-color: var(--brand-blue); color: white; text-decoration: none; padding: 15px; border-radius: 8px; font-family: 'OneDotCd-Bold'; margin-top: 20px; text-align: center; border: none; cursor: pointer; width: 100%; }

        /* --- ADMIN STYLES --- */
        .admin-section { display: none; flex-direction: column; gap: 15px; }
        .admin-header { background: var(--text-dark); color: white; padding: 10px; text-align: center; font-family: 'PizzaPress'; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
        .data-table th { background: var(--brand-blue); color: white; padding: 8px; text-align: left; }
        .data-table td { border-bottom: 1px solid #ccc; padding: 8px; }
        .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .link-btn { background: #ddd; padding: 10px; text-align: center; border-radius: 4px; text-decoration: none; color: black; font-weight: bold; font-size: 0.9rem; display:block; border: 1px solid #ccc; }

        /* --- PDF VIEWER STYLING --- */
        #pdf-view {
            display: none; flex-direction: column; background: white; z-index: 2000;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 1000px; height: 85vh;
            border-radius: 8px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); border: 2px solid var(--brand-blue);
        }
        @media (max-width: 768px) {
            #pdf-view { top: 0; left: 0; transform: none; width: 100%; height: 100%; border-radius: 0; border: none; box-shadow: none; }
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* Black w/ opacity */
            backdrop-filter: blur(2px);
        }
        
        .modal-content {
            background-color: white;
            margin: 10% auto; /* 10% from top, centered */
            padding: 25px;
            border: 2px solid var(--brand-blue);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-family: 'OneDotCd', sans-serif;
            position: relative;
        }
        
        .close-modal {
            color: var(--brand-red);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close-modal:hover {
            color: var(--dark-red);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-family: 'OneDotCd-Bold';
            color: var(--brand-blue);
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--crust-dark);
            border-radius: 4px;
            font-family: 'OneDotCd';
            font-size: 16px;
            box-sizing: border-box; /* Fixes padding width issues */
        }
        
        #supportSubmitBtn {
            background-color: var(--brand-red);
            color: white;
            border: none;
            padding: 12px 20px;
            font-family: 'OneDotCd-Bold';
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        #supportSubmitBtn:hover {
            background-color: var(--acc-red);
        }
        
        /* Update the Footer to match the new clean look */
        footer {
            background-color: #f4f4f4; /* Light Grey */
            padding: 20px 15px; /* Comfortable padding */
            text-align: center;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            margin-top: auto; /* Pushes footer to bottom if content is short */
        }
        
        /* Slogan */
        .footer-slogan {
            display: block;
            font-family: 'PizzaPress'; 
            font-size: 1.2rem; /* Slightly larger */
            color: var(--brand-blue); 
            margin-bottom: 15px;
        }
        
        /* Admin Link */
        .admin-link {
            display: block;
            margin-bottom: 25px; /* Push the button down */
            color: #999;
            text-decoration: none;
            font-size: 0.8rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Support Button Wrapper - Cleaned up */
        .footer-support-wrapper {
            padding: 0; 
            background: transparent; 
        }
        
        /* The Button Itself */
        .footer-support-btn {
            background: white; 
            border: 1px solid var(--brand-blue);
            color: var(--brand-blue);
            padding: 10px 24px; /* Bigger touch target for mobile */
            border-radius: 30px; /* Full Pill shape */
            cursor: pointer;
            font-family: 'OneDotCd-Bold';
            font-size: 0.9rem;
            transition: all 0.2s ease;
            width: 100%; /* Full width on mobile for easy tapping */
            max-width: 300px; /* But don't get too crazy on desktop */
        }
        
        .footer-support-btn:hover {
            background-color: var(--brand-blue);
            color: white;
        }
        
        /* Ensure Mobile sees the blue background at the very bottom if you overscroll */
        body {
            background-color: var(--brand-blue);
        }

    </style>
</head>
<body>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container" id="app-view">
        <header>
            <img src="New_Logo_v2.png" alt="Team Wow Logo" class="logo">
            <h1>Driver Rewards</h1>
        </header>

        <main>
            
            <!-- VIEW 1: DRIVER SEARCH (Default) -->
            <div id="driver-view">
                <div>
                    <label for="marketSelect">1. SELECT MARKET</label>
                    <select id="marketSelect">
                        <option value="" disabled selected>Tap to choose...</option>
                        <option value="Dallas">Dallas</option>
                        <option value="Denver">Denver</option>
                        <option value="El Paso">El Paso</option>
                        <option value="LA">LA</option>
                    </select>
                </div>

                <div id="searchSection" style="opacity:0.5; pointer-events:none;">
                    <label for="nameInput">2. ENTER NAME</label>
                    <input type="text" id="nameInput" placeholder="e.g. John Smith">
                    <button class="btn-main" id="searchBtn">Check My Points</button>
                </div>

                <div id="loading" style="display:none; text-align:center; padding:20px;"><p>Checking Database...</p></div>

                <div id="resultCard" class="results-card">
                    <div class="driver-name" id="resName">DRIVER NAME</div>
                    <div class="store-badge" id="resStore">Store #0000</div>
                    <div class="points-label">Current Balance</div>
                    <div class="points-value" id="resPoints">0</div>
                    <button class="prize-btn" onclick="openPrizePdf()">🎁 VIEW PRIZE LIST</button>
                </div>
                <div id="errorMsg" style="color:red; text-align:center; display:none;"></div>
            </div>

            <!-- VIEW 3: ADMIN DASHBOARD (Hidden) -->
            <div id="admin-view" class="admin-section">
                <div class="admin-header">MANAGER DASHBOARD <button onclick="logoutAdmin()" style="float:right; font-size:0.8rem; background:red; color:white; border:none; padding:2px 5px;">LOGOUT</button></div>
                
                <label>PURCHASE PRIZES</label>
                <div id="adminLinks" class="link-grid">
                    <p>Loading Links...</p>
                </div>

                <label style="margin-top:20px;">DRIVER LEADERBOARD</label>
                <select id="adminDoSelect">
                    <option value="">Filter by DO...</option>
                </select>
                <select id="adminStoreSelect" style="display:none;">
                    <option value="">Filter by Store...</option>
                </select>

                <div id="adminTableContainer" style="overflow-y:auto; max-height:400px;">
                    <table class="data-table" id="adminTable">
                        <thead><tr><th>Name</th><th>Store</th><th>Points</th></tr></thead>
                        <tbody><tr><td colspan="3">Select a DO to view data.</td></tr></tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer>
            <span class="footer-slogan">Drive Safe. Earn Points. Win Big.</span>
            
            <a href="#" class="admin-link">Manager / DO Login</a>
            
            <div class="footer-support-wrapper">
                <button onclick="toggleSupportModal()" class="footer-support-btn">Technical Support / Feedback</button>
            </div>
        </footer>
    </div>

    <!-- PDF VIEWER -->
    <div id="pdf-view">
        <div style="padding:15px; background:var(--brand-blue); color:white; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-family:'PizzaPress'; font-size:1.2rem;">PRIZE LIST</span>
            <button onclick="closeViewer()" style="border:2px solid white; background:transparent; color:white; padding:5px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">CLOSE X</button>
        </div>
        <iframe id="pdf-frame" src="" style="flex-grow:1; width:100%; border:none;"></iframe>
    </div>

    <!-- SUPPORT MODAL -->
    <div id="supportModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleSupportModal()">&times;</span>
            <h2 style="font-family: 'PizzaPress'; color: var(--brand-blue);">Report an Issue</h2>
            <p style="font-family: 'OneDotCd'; color: var(--crust-deep);">Found a bug? Need help? Let us know.</p>
            
            <form id="supportForm" onsubmit="submitSupport(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" id="supportName" required placeholder="Your Name">
                </div>
    
                <div class="form-group">
                    <label>Issue Type</label>
                    <select name="issueType" id="supportType">
                        <option value="Missing Points/Score Error">Missing Points / Score Error</option>
                        <option value="Bug/Page Issue">Page Not Loading / Bug</option>
                        <option value="Feature Request">Feature Request</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" id="supportMessage" rows="4" required placeholder="Describe the issue..."></textarea>
                </div>
    
                <button type="submit" id="supportSubmitBtn">Send Report</button>
                <div id="supportStatus"></div>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_URL = "https://script.google.com/macros/s/AKfycbyiaMniI6OvMb2tDjA0ItpPnPXRpA8Bpu7LCvDcZHgG00z2T7IIV-WVAebGEr4WXuI8/exec"; 
        const PDF_URL = "resources/drivosity/driver_prizes.pdf"; 

        // GLOBAL STATE
        let ALL_DRIVERS = []; // Cache for Admin View

        // --- DRIVER SEARCH LOGIC ---
        const marketSelect = document.getElementById('marketSelect');
        const searchBtn = document.getElementById('searchBtn');
        const nameInput = document.getElementById('nameInput');

        marketSelect.addEventListener('change', () => {
            document.getElementById('searchSection').style.opacity = "1";
            document.getElementById('searchSection').style.pointerEvents = "auto";
        });

        searchBtn.addEventListener('click', async () => {
            const market = marketSelect.value;
            const name = nameInput.value.trim().toLowerCase();
            if (!market || !name) { alert("Please select a market and enter your name."); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
            searchBtn.innerText = "Searching...";

            try {
                const response = await fetch(`${API_URL}?action=getPoints&market=${market}`);
                const data = await response.json();

                if (data.status === 'success') {
                    // CACHE DATA FOR ADMIN USE LATER
                    ALL_DRIVERS = data.data; 

                    /* NEW FUZZY SEARCH LOGIC */
                    const searchTerms = name.toLowerCase().split(' '); // ["fred", "nelson"]
                    
                    const driver = data.data.find(d => {
                        const driverName = d.name.toLowerCase();
                        // Check if EVERY search term appears somewhere in the driver's name
                        return searchTerms.every(term => driverName.includes(term));
                    });

                    document.getElementById('loading').style.display = 'none';
                    searchBtn.innerText = "Check My Points";

                    if (driver) {
                        document.getElementById('resName').innerText = driver.name;
                        document.getElementById('resStore').innerText = "Store #" + driver.store;
                        document.getElementById('resPoints').innerText = driver.points;
                        document.getElementById('resultCard').style.display = 'block';
                    } else {
                        document.getElementById('errorMsg').innerText = "Driver not found in " + market + ".";
                        document.getElementById('errorMsg').style.display = 'block';
                    }
                }
            } catch (e) {
                console.error(e);
                alert("Connection Error.");
            }
        });

        // --- ADMIN LOGIC ---
        async function adminLogin() {
            const pass = prompt("Enter Password:");
            if (pass === "TeamWow") {
                // Switch Views
                document.getElementById('driver-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'flex';
                
                // Load Links
                loadAdminLinks();
                
                // Check if we have data (if user hasn't searched yet, fetch it)
                if (ALL_DRIVERS.length === 0 && marketSelect.value) {
                    // Fetch silently if market is picked
                     const response = await fetch(`${API_URL}?action=getPoints&market=${marketSelect.value}`);
                     const data = await response.json();
                     ALL_DRIVERS = data.data;
                }
                
                // Populate Filters
                populateDoFilter();
            } else {
                alert("Incorrect Password.");
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('driver-view').style.display = 'block';
        }

        async function loadAdminLinks() {
            const container = document.getElementById('adminLinks');
            try {
                const response = await fetch(`${API_URL}?action=getAdminLinks`);
                const links = await response.json();
                container.innerHTML = links.map(l => `<a href="${l.url}" target="_blank" class="link-btn">🛒 ${l.name}</a>`).join('');
            } catch (e) {
                container.innerHTML = "Error loading links.";
            }
        }

        function populateDoFilter() {
            const select = document.getElementById('adminDoSelect');
            select.innerHTML = '<option value="">Filter by DO...</option>';
            
            // Extract Unique DOs
            const dos = [...new Set(ALL_DRIVERS.map(d => d.doName).filter(Boolean))].sort();
            dos.forEach(d => {
                select.innerHTML += `<option value="${d}">${d}</option>`;
            });

            // When DO changes, populate Stores
            select.onchange = () => {
                populateStoreFilter();
                filterAdminTable();
            };
        }

        function populateStoreFilter() {
            const doName = document.getElementById('adminDoSelect').value;
            const storeSelect = document.getElementById('adminStoreSelect');
            
            if (!doName) {
                storeSelect.style.display = 'none';
                return;
            }

            // Find stores for this DO
            const stores = [...new Set(ALL_DRIVERS
                .filter(d => d.doName === doName)
                .map(d => d.store)
            )].sort();

            storeSelect.innerHTML = '<option value="">All Stores</option>';
            stores.forEach(s => {
                storeSelect.innerHTML += `<option value="${s}">Store #${s}</option>`;
            });

            storeSelect.style.display = 'inline-block';
            storeSelect.onchange = () => filterAdminTable();
        }

        function filterAdminTable() {
            const doName = document.getElementById('adminDoSelect').value;
            const storeNum = document.getElementById('adminStoreSelect').value;
            const tbody = document.querySelector('#adminTable tbody');
            
            if (!doName) {
                tbody.innerHTML = '<tr><td colspan="3">Select a DO to view data.</td></tr>';
                return;
            }

            // Filter by DO... AND Store (if selected)
            let filtered = ALL_DRIVERS.filter(d => d.doName === doName);
            
            if (storeNum) {
                filtered = filtered.filter(d => String(d.store) === String(storeNum));
            }

            // Sort by Points High->Low
            filtered.sort((a, b) => b.points - a.points);

            tbody.innerHTML = filtered.map(d => `
                <tr>
                    <td>${d.name}</td>
                    <td>${d.store}</td>
                    <td><strong>${d.points}</strong></td>
                </tr>
            `).join('');
        }

        // --- PDF VIEWERS ---
        function openPrizePdf() {
            document.getElementById('pdf-view').style.display = 'flex';
            document.getElementById('pdf-frame').src = PDF_URL;
        }
        function closeViewer() {
            document.getElementById('pdf-view').style.display = 'none';
            document.getElementById('pdf-frame').src = "";
        }
        
        nameInput.addEventListener("keypress", function(event) { if (event.key === "Enter") searchBtn.click(); });

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKhcd3c4j2SwJOTtG5c7yZxDEIC-Mw-d-zYE27CQuALwyd2rmU_6BQMYQwjqVwQ89N/exec'; 

        function toggleSupportModal() {
            const modal = document.getElementById('supportModal');
            if (modal.style.display === "block") {
                modal.style.display = "none";
            } else {
                modal.style.display = "block";
            }
        }
        
        // Close modal if user clicks outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('supportModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
        
        function submitSupport(e) {
            e.preventDefault();
            const btn = document.getElementById('supportSubmitBtn');
            const status = document.getElementById('supportStatus');
            
            btn.disabled = true;
            btn.textContent = "Sending...";
            
            const formData = new FormData(document.getElementById('supportForm'));
            
            // Add parameters manually to URL for GET/POST fetch
            // Note: We use 'no-cors' mode for GAS, but it's cleaner to just build the URL params
            const data = new URLSearchParams();
            for (const pair of formData) {
                data.append(pair[0], pair[1]);
            }
        
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: data
            })
            .then(response => {
                btn.textContent = "Sent!";
                btn.style.backgroundColor = "var(--brand-blue)";
                status.innerHTML = "<p style='color: green; text-align: center;'>Thank you! We received your report.</p>";
                
                setTimeout(() => {
                    toggleSupportModal(); // Close modal after 2s
                    document.getElementById('supportForm').reset(); // Reset form
                    btn.disabled = false;
                    btn.textContent = "Send Report";
                    btn.style.backgroundColor = "var(--brand-red)";
                    status.innerHTML = "";
                }, 2000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                status.innerHTML = "<p style='color: red;'>Error sending report. Please try again.</p>";
                btn.disabled = false;
                btn.textContent = "Try Again";
            });
        }

    </script>
</body>
</html>
