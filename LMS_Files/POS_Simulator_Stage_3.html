    <!-- JAVASCRIPT FOR STAGE 3.0 -->
    <script>

        // --- AUTO ERROR REPORTING ---
        function reportErrorToDeveloper(errorType, details) {
            const market = localStorage.getItem('tw_market') || 'Unknown Market';
            const id = localStorage.getItem('tw_id') || 'Unknown ID';
            const currentStepNum = typeof currentStep !== 'undefined' ? currentStep : 'N/A';
            
            // Create an informative payload
            const payload = {
                market: market,
                userId: id,
                module: 'Day 1 Mod 4 Practice Stage 3',
                step: currentStepNum,
                errorType: errorType,
                details: details,
                userAgent: navigator.userAgent
            };

            const url = `${AUTH_SCRIPT_URL}?action=error&data=${encodeURIComponent(JSON.stringify(payload))}`;
            
            // Send it in the background
            fetch(url, { method: 'GET', credentials: 'omit' })
                .then(() => console.log("Error report sent successfully."))
                .catch(err => console.error("Could not send error report:", err));
        }

        // 1. Capture general JavaScript exceptions (e.g., code crashes)
        window.onerror = function (message, source, lineno, colno, error) {
            const details = `${message} at ${source}:${lineno}:${colno}`;
            reportErrorToDeveloper('JavaScript Exception', details);
            return false; // let browser handle it normally too
        };

        // 2. Capture asset-loading failures
        window.addEventListener('error', function (event) {
            if (event.target && event.target.tagName === 'IMG') {
                reportErrorToDeveloper('Broken Image Asset', event.target.src);
            }
        }, true);

        // Sequence Data (Configured with test audio and typing rules) [1]
        const sequence = [
            {
                "step": 0,
                "image": "resources/POS_assets/Stage_3/POS_A.png",
                "activeHitbox": "hb-anywhere",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><p style='margin-bottom: 16px;'><strong>Taking Phone Calls</strong><br><br>Listen to a quick overview on phone etiquette and taking customer orders like a pro.</p><p style='margin-bottom: 24px;'>Press play above to hear an overview before jumping into the simulator.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Listen to the audio message, then click anywhere on the POS screen to begin.</p>",
                "audio": {
                    "file": "resources/POS_assets/Stage_3_audio/Coach_Bobby_Phone_Intro.m4a",
                    "requireAllPlayed": true
                }
            },
            {
                "step": 1,
                "image": "resources/POS_assets/Stage_3/POS_B.png",
                "activeHitbox": "hb-anywhere",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><p style='margin-bottom: 16px;'><strong>Call Greetings</strong><br><br>A strong, welcoming greeting sets the tone for a great customer experience. Listen closely to these two greeting examples to hear how to open a phone order professionally.</p><p style='margin-bottom: 24px;'>Listen to Part 1 first to unlock Part 2. You must listen to both recordings before moving to the next step.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Once the calls are complete, click anywhere on the POS screen to continue.</p>",
                "audio": {
                    "tracks": [
                        { "id": "t1", "label": "Call 1: Greeting Example 1", "file": "resources/POS_assets/Stage_3_audio/Victor_Example_1.mp3" },
                        { "id": "t2", "label": "Call 2: Greeting Example 2", "file": "resources/POS_assets/Stage_3_audio/Victor_Example_2.mp3" }
                    ],
                    "requireAllPlayed": true,
                    "sequential": true
                }
            },
            {
                "step": 2,
                "image": "resources/POS_assets/Stage_0/POS_7.png",
                "activeHitbox": "hb-carryout",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><p style='margin-bottom: 8px;'><br><strong>Full Order Call</strong><br><br>Now that you have a strong place to start, try listening to a complete customer call. See if you can identify the different parts of the call that resemble the order entry steps you learned previously.</p><p style='margin-bottom: 32px;'>Pay close attention to how the customer provides their contact and order details, as well as what the team member says to help guide them throughout the conversation.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> After the recording completes, click the <strong>Carryout</strong> button to continue.</p>",
                "audio": {
                    "file": "resources/POS_assets/Stage_3_audio/Example_1_Full.mp3",
                    "requireAllPlayed": true
                }
            },
            {
                "step": 3,
                "image": "resources/POS_assets/Stage_0/POS_7.png",
                "activeHitbox": "hb-carryout",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><p style='margin-bottom: 8px;'><br><strong>Step-by-Step Order Entry</strong><br><br>Now we will break that call down into smaller segments. For each step, you will listen to a short audio clip and enter the corresponding customer details directly into the POS system.</p><p style='margin-bottom: 32px;'>Take your time to listen for key details like phone numbers, customer names, and street addresses.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the <strong>Carry Out</strong> button to start entering the order.</p>"
            },
            {
                "step": 4,
                "image": "resources/POS_assets/Stage_1.1/POS_1.3.png",
                "activeHitbox": "hb-cust-name",
                "instruction": "<p>👉 Listen to the audio and enter the customer's name.</p>",
                "audio": {
                    "file": "resources/audio/customer_name.mp3" // Simple and clean
                },
                "input": {
                    "type": "text",
                    "expectedValue": "Training",
                    "placeholder": "Enter Name..."
                }
            },
            {
                "step": 5,
                "image": "resources/POS_assets/Stage_1.1/POS_1.4.png",
                "activeHitbox": "hb-add-number",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the first address field to enter the address number.</p>"
            },
            {
                "step": 6,
                "image": "resources/POS_assets/Stage_1.1/POS_1.5.png",
                "activeHitbox": "hb-street-name",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550 Eldorado Pkwy</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the next address field to enter the street name.</p>"
            },
            {
                "step": 7,
                "image": "resources/POS_assets/Stage_1.1/POS_1.6.png",
                "activeHitbox": "hb-street-select",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550 Eldorado Pkwy, McKinney, TX 75070</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Select the corresponding street name.</p>"
            },
            {
                "step": 8,
                "image": "resources/POS_assets/Stage_0/POS_11.png",
                "activeHitbox": "hb-rewards-checker",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550 Eldorado Pkwy, McKinney, TX 75070</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Confirm the Rewards Status.</p>"
            },
            {
                "step": 9,
                "image": "resources/POS_assets/Stage_0/POS_12.png",
                "activeHitbox": "hb-rewards-ok",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550 Eldorado Pkwy, McKinney, TX 75070</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Check the Rewards Status.</p>"
            },
            {
                "step": 10,
                "image": "resources/POS_assets/Stage_0/POS_13.png",
                "activeHitbox": "hb-greeting-tab",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Practice</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550 Eldorado Pkwy, McKinney, TX 75070</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> After verifying all information is correct, navigate back to the <strong>Greetings/Specials</strong> screen to continue.</p>"
            }
        ];
        
        // --- RELATIONAL TRACKING STATE ---
        const moduleStartTime = Date.now(); // Start timer as soon as practice loads
        let wrongClicks = 0;               // Tracks practice mistakes
        const AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRM9OqqGMhDmrssDQ3MMEleWEsWbYra9xtuwlJJYLct4WeBA5j15B53Bzcmla54Pcfig/exec';

        let currentStep = 0;
        const posImage = document.getElementById('pos-image');
        const instructionText = document.getElementById('instruction-text');
        const errorMsg = document.getElementById('error-message');
        const hitboxWrapper = document.getElementById('hitbox-wrapper');

        // --- AUDIO COMPONENT ENGINE ---
        const audioPlayer = document.getElementById('global-audio-player');
        const audioPanel = document.getElementById('audio-control-panel');

        let completedTracks = new Set();
        let currentPlayingTrackIndex = null;

        function handleAudioForStep(stepData) {
            completedTracks.clear();
            currentPlayingTrackIndex = null;

            if (!stepData.audio) {
                audioPanel.style.display = 'none';
                audioPlayer.pause();
                return;
            }

            audioPanel.style.display = 'block';

            // Supports single-track or multi-track audio steps seamlessly
            const tracks = stepData.audio.tracks || [
                { id: "track-0", label: "Live Call", file: stepData.audio.file }
            ];

            const isSequential = stepData.audio.sequential !== false && tracks.length > 1;
            const requireAll = stepData.audio.requireAllPlayed === true || tracks.length > 1;

            let html = `<div class="audio-header"><span class="audio-pulse-indicator"></span> Live Audio Call</div>`;
            html += `<div class="audio-track-stack">`;

            tracks.forEach((track, index) => {
                const isLocked = isSequential && index > 0;
                const lockClass = isLocked ? 'locked' : '';
                const lockIcon = isLocked ? '🔒 ' : '';

                html += `
                    <div id="track-row-${index}" class="audio-track-row ${lockClass}">
                        <div class="track-label">${lockIcon}${track.label}</div>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <span id="badge-track-${index}" class="track-badge pending">Unheard</span>
                            <button id="btn-track-${index}" class="audio-btn" style="padding: 4px 10px; font-size: 0.8rem;" 
                                ${isLocked ? 'disabled' : ''} onclick="playTrack(${index})">
                                ▶ Play
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            audioPanel.innerHTML = html;

            // Gate active hitbox visibility until required audio finishes
            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb && requireAll) {
                activeHb.style.display = 'none';
            }
        }

        function playTrack(index) {
            const stepData = sequence[currentStep];
            const tracks = stepData.audio.tracks || [
                { id: "track-0", label: "Live Call", file: stepData.audio.file }
            ];

            const targetTrack = tracks[index];

            // Toggle pause/play on current track
            if (currentPlayingTrackIndex === index && !audioPlayer.paused) {
                audioPlayer.pause();
                updateTrackUI(index, 'paused');
                return;
            }

            audioPlayer.src = targetTrack.file;
            audioPlayer.play();
            currentPlayingTrackIndex = index;

            tracks.forEach((_, i) => {
                if (i === index) {
                    updateTrackUI(i, 'playing');
                } else if (!completedTracks.has(i)) {
                    updateTrackUI(i, 'pending');
                }
            });

            audioPlayer.onended = function() {
                completedTracks.add(index);
                updateTrackUI(index, 'complete');

                // Unlock next sequential track row
                const nextIndex = index + 1;
                if (tracks[nextIndex]) {
                    const nextRow = document.getElementById(`track-row-${nextIndex}`);
                    const nextBtn = document.getElementById(`btn-track-${nextIndex}`);
                    if (nextRow && nextBtn) {
                        nextRow.classList.remove('locked');
                        nextBtn.disabled = false;
                        const labelEl = nextRow.querySelector('.track-label');
                        if (labelEl) labelEl.innerText = tracks[nextIndex].label;
                    }
                }

                // Un-hide the hitbox once all tracks complete
                if (completedTracks.size === tracks.length) {
                    const activeHb = document.getElementById(stepData.activeHitbox);
                    if (activeHb) {
                        activeHb.style.display = 'block';
                    }
                }
            };
        }

        function updateTrackUI(index, state) {
            const badge = document.getElementById(`badge-track-${index}`);
            const btn = document.getElementById(`btn-track-${index}`);
            if (!badge || !btn) return;

            if (state === 'playing') {
                badge.className = 'track-badge playing';
                badge.innerText = 'Playing';
                btn.innerHTML = '⏸ Pause';
            } else if (state === 'paused') {
                badge.className = 'track-badge pending';
                badge.innerText = 'Paused';
                btn.innerHTML = '▶ Resume';
            } else if (state === 'complete') {
                badge.className = 'track-badge complete';
                badge.innerText = '✓ Complete';
                btn.innerHTML = '🔄 Replay';
            } else if (state === 'pending') {
                badge.className = 'track-badge pending';
                badge.innerText = 'Unheard';
                btn.innerHTML = '▶ Play';
            }
        }

        // --- DYNAMIC TEXT INPUT OVERLAY ENGINE ---
        function handleInputForStep(stepData, activeHb) {
            const existingInput = document.querySelector('.hitbox-text-input');
            if (existingInput) existingInput.remove();

            if (stepData.input && stepData.input.type === 'text') {
                activeHb.style.cursor = 'text';
                activeHb.style.caretColor = 'auto';

                const inputEl = document.createElement('input');
                inputEl.type = 'text';
                inputEl.className = 'hitbox-text-input';
                inputEl.placeholder = stepData.input.placeholder || '';
                inputEl.autofocus = true;

                // Stop dynamic background clicking issues while working in the field
                inputEl.addEventListener('click', (e) => e.stopPropagation());

                // Enter Key Submission event
                inputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        validateTextEntry(inputEl.value, stepData.input.expectedValue);
                    }
                });

                activeHb.appendChild(inputEl);
                inputEl.focus();
            } else {
                activeHb.style.cursor = 'default';
                activeHb.style.caretColor = 'transparent';
            }
        }

        function validateTextEntry(userTyped, expectedValue) {
            const cleanUser = userTyped.trim().toLowerCase();
            const cleanExpected = expectedValue.trim().toLowerCase();

            if (cleanUser === cleanExpected) {
                errorMsg.style.display = 'none';
                currentStep++;
                loadStep(currentStep);
            } else {
                errorMsg.style.display = 'block';
                wrongClicks++; 
            }
        }


        // Fetch the global hitboxes automatically
        fetch('Globals/LMS_Master_html.html')
            .then(response => response.text())
            .then(html => {
                hitboxWrapper.insertAdjacentHTML('beforeend', html);
                initializeSimulator();
            })
            .catch(error => {
                console.error("Error loading hitboxes:", error);
                instructionText.innerHTML = "<strong>Error:</strong> Could not load hitboxes. Check console.";
            });

        // Global advanceStep function capable of parsing any argument structure
        window.advanceStep = function(target) {
            let clickedId = "";

            if (typeof target === 'string') {
                clickedId = target;
            } else if (target && target.id) {
                clickedId = target.id;
            } else if (target && target.target) {
                clickedId = target.target.id;
            } else if (window.event) {
                const eventTarget = window.event.currentTarget || window.event.target;
                if (eventTarget) {
                    clickedId = eventTarget.id;
                }
            } 

            const stepData = sequence[currentStep];

            // If this is a typing step, ignore click advances on this hitbox
            if (stepData.input && stepData.input.type === 'text') {
                return;
            }

            const activeHitboxId = stepData.activeHitbox;

            // If the clicked ID matches the active hitbox for the current step
            if (clickedId === activeHitboxId) {
                errorMsg.style.display = 'none'; 
                currentStep++; 
                loadStep(currentStep); 
            }
        };

        function initializeSimulator() {
            // Bind listeners to all hitboxes to guarantee execution if inline onclick is missing
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.addEventListener('click', function(e) {
                    advanceStep(this);
                });
            });

            // Tracks incorrect clicks on the background image
            posImage.addEventListener('click', function() {
                // If it is a text-typing step, clicking the BG image does not register as incorrect immediately
                const stepData = sequence[currentStep];
                if (stepData.input && stepData.input.type === 'text') {
                    return;
                }
                errorMsg.style.display = 'block';
                wrongClicks++; 
            });

            // ---- JUMP TO STEP VIA URL QUERY PARAMETER ----
            const urlParams = new URLSearchParams(window.location.search);
            const stepParam = urlParams.get('step');
            
            if (stepParam !== null) {
                const targetStep = parseInt(stepParam, 10);
                if (!isNaN(targetStep) && targetStep >= 0 && targetStep < sequence.length) {
                    currentStep = targetStep;
                }
            }

            loadStep(currentStep);
        }

        function sendProgressUpdate(moduleName, status = "Completed") {
            const market = localStorage.getItem('tw_market');
            const id = localStorage.getItem('tw_id');
            if (!market || !id) return;

            const timeSpent = Math.floor((Date.now() - moduleStartTime) / 1000);
            
            const answers = {
                "Stage 3 Wrong Clicks": wrongClicks,
                "Stage 3 Status": "Finished Tutorial"
            };
            const answersStr = encodeURIComponent(JSON.stringify(answers));

            const url = `${AUTH_SCRIPT_URL}?action=update&market=${market}&id=${id}&module=${encodeURIComponent(moduleName)}&timeSpent=${timeSpent}&answers=${answersStr}&status=${status}`;
            
            console.log("SENDING STAGE 3 DATA: ", url);
            fetch(url, { method: 'GET', credentials: 'omit' });
        }

        function loadStep(stepIndex) {
            if (stepIndex >= sequence.length) {
                instructionText.innerHTML = "<strong>🎉 Simulation Complete!</strong><br><br>You've successfully completed the currently completed stages.";
                posImage.src = "resources/POS_assets/under_construction.png";
                document.querySelectorAll('.hitbox').forEach(hb => hb.style.display = 'none');
                audioPanel.style.display = 'none';
                audioPlayer.pause();
                return;
            }

            const stepData = sequence[stepIndex];
            posImage.src = stepData.image;
            instructionText.innerHTML = stepData.instruction;
            
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.style.display = 'none';
            });
            
            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb) {
                activeHb.style.display = 'block';
                activeHb.classList.remove('arrow-bottom'); 

                if (stepIndex >= 58) { 
                    activeHb.classList.add('hide-arrow'); 
                } else {
                    activeHb.classList.remove('hide-arrow'); 
                }

                // Call modular processors for audio files and text overlays
                handleAudioForStep(stepData);
                handleInputForStep(stepData, activeHb);

            } else {
                // Validation error check if asset missing from DOM
                reportErrorToDeveloper('Missing Hitbox Element', `Expected ID "${stepData.activeHitbox}" but it was not found in the DOM.`);
            }            

            const finishBtn = document.getElementById('finish-sim-btn');
            if (finishBtn) {
                if (stepIndex === sequence.length - 1) {
                    finishBtn.style.display = 'inline-block'; 
                } else {
                    finishBtn.style.display = 'none'; 
                }
            }
        }
        
        function endSimulation() {
            posImage.src = "resources/POS_assets/Stage_1.1/under_construction.png"; 
            instructionText.innerHTML = "<strong>Stage 3 Complete</strong><br><br>The next phase of the simulator is currently in development.<br><br>Click the red button below to save your progress and return to the Day 1 Dashboard.";
            document.querySelectorAll('.hitbox').forEach(hb => hb.style.display = 'none');
            audioPanel.style.display = 'none';
            audioPlayer.pause();
            
            const finishBtn = document.getElementById('finish-sim-btn');
            finishBtn.style.display = 'inline-block'; 
            finishBtn.innerText = "Save & Return to Day 1"; 

            finishBtn.onclick = function() {
                finishBtn.innerText = "Saving...";
                finishBtn.style.pointerEvents = "none";
                finishBtn.style.opacity = "0.5";

                sendProgressUpdate('Day 1 Mod 4', 'Completed');
                localStorage.setItem('mod4_complete', 'true');

                setTimeout(() => {
                    window.location.href = 'https://tw-dallas.github.io/TW-Career-Path/LMS_Files/lms_dashboard.html#day1';
                }, 1500);
            };
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                loadStep(currentStep);
            }        
        }

        function goNext() {
            if (currentStep < sequence.length - 1) {
                currentStep++;
                loadStep(currentStep);
            }
        }
    </script>
</body>
</html>
