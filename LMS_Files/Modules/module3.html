    <style>
        .classroom-container {
            max-width: 900px;
            margin: 2rem auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 6px solid var(--brand-blue);
        }

        .classroom-header {
            background: var(--crust-light);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--crust-med);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-title {
            font-family: 'OneDotCd-Bold';
            font-size: 1.8rem;
            color: var(--dark-blue);
            margin: 0;
            text-transform: uppercase;
        }

        .step-indicator {
            font-family: 'OneDotCd-Bold';
            color: var(--brand-blue);
            background: rgba(0, 144, 226, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .classroom-content {
            padding: 2rem;
            min-height: 400px; /* Keep height stable during transitions */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Step 1: Video --- */
        .video-wrapper {
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .mock-play-btn {
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .mock-play-btn:hover { transform: scale(1.1); }

        /* --- Step 2: Knowledge Check --- */
        .quiz-container {
            width: 100%;
            max-width: 600px;
            text-align: left;
        }

        .quiz-question {
            font-family: 'OneDotCd-Bold';
            font-size: 1.4rem;
            color: var(--crust-deep);
            margin-bottom: 1.5rem;
        }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--crust-base);
            border: 2px solid var(--crust-med);
            border-radius: 8px;
            font-family: 'OneDotCd';
            font-size: 1.1rem;
            color: var(--crust-deep);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .quiz-option:hover {
            border-color: var(--brand-blue);
            background: rgba(0, 144, 226, 0.05);
        }

        .quiz-option.selected {
            border-color: var(--brand-blue);
            background: var(--brand-blue);
            color: white;
        }

        /* --- Step 3: Prompt --- */
        .prompt-container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .prompt-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .prompt-text {
            font-size: 1.5rem;
            color: var(--crust-deep);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        /* --- Footer Controls --- */
        .classroom-footer {
            padding: 1.5rem 2rem;
            background: var(--crust-light);
            border-top: 2px solid var(--crust-med);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: var(--brand-blue);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-family: 'OneDotCd-Bold';
            text-decoration: none;
            transition: var(--transition);
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            width: auto;
        }

        .btn:hover {
            background: var(--dark-blue);
            transform: scale(1.05);
        }

        .btn-outline {
            background: transparent;
            color: var(--brand-blue);
            border: 2px solid var(--brand-blue);
        }
        
        .btn-outline:hover {
            background: rgba(0, 144, 226, 0.1);
            color: var(--dark-blue);
            transform: scale(1.02);
        }

        .btn-disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
            transform: none !important;
            color: #888 !important;
            border: none !important;
        }

        .hidden { display: none !important; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================================
           SIDES & EXTRAS: CATEGORIES & FLIP CARDS CSS
           ======================================================== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            padding: 0 2rem 2rem 2rem;
            box-sizing: border-box;
        }

        .category-card {
            background: var(--crust-base);
            border: 2px solid var(--crust-med);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            box-sizing: border-box;
        }

        .category-card:hover {
            border-color: var(--brand-blue);
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .category-card.completed {
            border-color: #2e7d32;
            background: rgba(46, 125, 50, 0.05);
        }

        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.2rem;
            color: #2e7d32;
        }

        .flip-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            padding: 0 2rem 2rem 2rem;
            box-sizing: border-box;
        }

        .flip-card {
            background-color: transparent;
            height: 250px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .flip-card-front {
            background-color: var(--crust-base);
            border: 2px solid var(--crust-med);
            color: var(--crust-deep);
        }

        .flip-card-back {
            background-color: var(--brand-blue);
            color: white;
            transform: rotateY(180deg);
            justify-content: center;
            text-align: center;
        }

        .flip-card-back p {
            font-family: 'OneDotCd';
            font-size: 1.1rem;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>

        const AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRM9OqqGMhDmrssDQ3MMEleWEsWbYra9xtuwlJJYLct4WeBA5j15B53Bzcmla54Pcfig/exec';

        // --- SLIDESHOW LOGIC ---
        function renderSlide(index) {
            const slide = menuSlides[index];
            const contentContainer = document.getElementById('slide-content-container');
            
            if (slide.type === 'grid') {
                let gridHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem; text-align: left;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 1rem 0; text-transform: uppercase;">${slide.title}</h2>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 2rem 2rem 2rem;">`;
                
                slide.items.forEach(item => {
                    gridHTML += `
                        <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                            <h3 style="font-family: 'Subhead2', sans-serif; color: var(--crust-burnt); font-size: 1.4rem; margin: 0 0 8px 0;">${item.name}</h3>
                            <img src="${item.image}" alt="${item.name}" style="width: 100%; max-width: 220px; object-fit: contain; margin-bottom: 10px;">
                            <p style="font-family: 'OneDotCd'; color: var(--crust-deep); font-size: 1.05rem; margin: 0; line-height: 1.4;">${item.desc}</p>
                        </div>
                    `;
                });
                
                gridHTML += `</div>`;
                contentContainer.innerHTML = gridHTML;

            } else if (slide.type === 'list') {
                let listHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 1rem 0; text-transform: uppercase;">${slide.title}</h2>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 2rem 2rem 2rem;">`;
                
                slide.items.forEach(item => {
                    listHTML += `
                        <div style="border: 1px solid var(--crust-med); border-radius: 8px; background: var(--crust-base); display: flex; align-items: center; overflow: hidden; height: 100px;">
                            <div style="width: 100px; height: 100%; flex-shrink: 0; background: white; display: flex; align-items: center; justify-content: center;">
                                <img src="${item.image}" alt="${item.name}" style="max-width: 100%; max-height: 100%; object-fit: cover;">
                            </div>
                            <div style="padding: 0 20px; flex-grow: 1;">
                                <h4 style="margin: 0; color: var(--crust-deep); font-family: 'Subhead2'; font-size: 1.4rem;">${item.name}</h4>
                            </div>
                        </div>
                    `;
                });
                
                listHTML += `</div>`;
                contentContainer.innerHTML = listHTML;

            } else if (slide.type === 'full-image') {
                contentContainer.innerHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem; text-align: left;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 1rem 0; text-transform: uppercase;">${slide.title}</h2>
                    </div>
                    <div style="padding: 0 2rem 2rem 2rem; display: flex; justify-content: center;">
                        <img src="${slide.image}" alt="${slide.title}" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    </div>
                `;
            } else if (slide.type === 'interactive-categories') {
                renderInteractiveCategories();
            } else {
                contentContainer.innerHTML = `
                    <div style="display: flex; flex-wrap: wrap;">
                        <div style="flex: 1 1 350px; background: var(--crust-light); display: flex; align-items: center; justify-content: center; padding: 2rem;">
                            <img src="${slide.image}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        </div>
                        <div style="flex: 1 1 350px; padding: 2.5rem; display: flex; flex-direction: column; justify-content: center;">
                            <h2 style="font-family: 'PizzaPress'; color: var(--dark-blue); font-size: 2.2rem; margin-top: 0; margin-bottom: 1rem;">${slide.title}</h2>
                            <div style="font-family: 'OneDotCd'; color: #333; font-size: 1.15rem; line-height: 1.6;">${slide.desc}</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('slide-counter').innerText = `Slide ${index + 1} of ${menuSlides.length}`;
            
            // Manage standard footer navigation visibility rules
            if (slide.type === 'interactive-categories') {
                document.getElementById('btn-slide-prev').style.display = 'inline-block';
                document.getElementById('btn-slide-next').style.display = 'none';
                
                const gameBtn = document.getElementById('btn-start-game');
                gameBtn.style.display = 'inline-block';
                
                // Keep the game button locked until they explore all categories
                if (visitedCategories.size === totalCategories) {
                    gameBtn.classList.remove('btn-disabled');
                    gameBtn.style.pointerEvents = 'auto';
                    gameBtn.removeAttribute('disabled');
                } else {
                    gameBtn.classList.add('btn-disabled');
                    gameBtn.style.pointerEvents = 'none';
                    gameBtn.setAttribute('disabled', 'disabled');
                }
            } else {
                document.getElementById('btn-slide-prev').style.display = index === 0 ? 'none' : 'inline-block';
                document.getElementById('btn-slide-next').style.display = 'inline-block';
                document.getElementById('btn-start-game').style.display = 'none';
            }
        }

        function changeSlide(direction) {
            // Special handling: if we are inside a category's detail view, the footer "Previous" button brings us back to the categories selector
            if (currentSlide === menuSlides.length - 1 && currentSubView === 'detail' && direction === -1) {
                backToCategories();
                return;
            }
            
            // Strict boundaries to prevent indexing errors
            const targetSlide = currentSlide + direction;
            if (targetSlide >= 0 && targetSlide < menuSlides.length) {
                currentSlide = targetSlide;
                currentSubView = 'list'; // Reset selection state when navigating away
                renderSlide(currentSlide);
            }
        }

        // --- SIDES INTERACTIVE RENDERING ---
        function renderInteractiveCategories() {
            const contentContainer = document.getElementById('slide-content-container');
            
            if (currentSubView === 'list') {
                let catHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem; text-align: left; width: 100%; box-sizing: border-box;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 0.5rem 0; text-transform: uppercase;">Sides & Extras</h2>
                        <p id="sides-instructions" style="font-family: 'OneDotCd'; color: var(--crust-deep); font-size: 1.1rem; margin: 0 0 1rem 0;">Select each category to review our side items, desserts, drinks, and dipping cups. You must view all categories to unlock the knowledge challenge.</p>
                    </div>
                    <div class="category-grid">
                `;
                
                Object.keys(sidesData).forEach(key => {
                    const isCompleted = visitedCategories.has(key);
                    const completedClass = isCompleted ? 'completed' : '';
                    const badge = isCompleted ? `<span class="category-badge">&#10003;</span>` : '';
                    
                    catHTML += `
                        <div class="category-card ${completedClass}" onclick="selectCategory('${key}')">
                            ${badge}
                            <h3 style="font-family: 'Subhead2'; color: var(--crust-burnt); font-size: 1.25rem; margin: 0;">${sidesData[key].title}</h3>
                        </div>
                    `;
                });
                
                catHTML += `</div>`;
                contentContainer.innerHTML = catHTML;
                updateInteractiveInstructionText();
                
            } else if (currentSubView === 'detail' && activeCategory) {
                const category = sidesData[activeCategory];
                
                let detailHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem; text-align: left; width: 100%; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <button onclick="backToCategories()" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.95rem; margin-bottom: 0.5rem; border-radius: 4px;">&larr; Back to Categories</button>
                            <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0; text-transform: uppercase;">${category.title}</h2>
                        </div>
                        <div style="font-family: 'OneDotCd-Bold'; color: var(--brand-blue); font-size: 1rem; border: 2px dashed var(--brand-blue); padding: 5px 12px; border-radius: 5px;">
                            Click any card to reveal details!
                        </div>
                    </div>
                    <div class="flip-grid" style="${category.items.length > 6 ? 'max-height: 520px; overflow-y: auto;' : ''}">
                `;
                
                category.items.forEach(item => {
                    detailHTML += `
                        <div class="flip-card" onclick="toggleCardFlip(this)">
                            <div class="flip-card-inner">
                                <div class="flip-card-front">
                                    <h4 style="margin: 0 0 10px 0; color: var(--crust-burnt); font-family: 'Subhead2'; font-size: 1.25rem;">${item.name}</h4>
                                    <img src="${item.image}" alt="${item.name}" style="max-height: 120px; max-width: 100%; object-fit: contain; margin-bottom: 10px;">
                                    <span style="font-size: 0.85rem; color: #888; font-family: 'OneDotCd';">Tap to Flip</span>
                                </div>
                                <div class="flip-card-back">
                                    <h4 style="margin: 0 0 10px 0; font-family: 'Subhead2'; font-size: 1.25rem;">${item.name}</h4>
                                    <p>${item.desc}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                detailHTML += `</div>`;
                contentContainer.innerHTML = detailHTML;
            }
        }

        function selectCategory(key) {
            visitedCategories.add(key);
            activeCategory = key;
            currentSubView = 'detail';
            renderInteractiveCategories();
            updateGameButtonState();
        }

        function backToCategories() {
            currentSubView = 'list';
            activeCategory = null;
            renderInteractiveCategories();
            updateGameButtonState();
        }

        function toggleCardFlip(cardElement) {
            cardElement.classList.toggle('flipped');
        }

        function updateInteractiveInstructionText() {
            const instr = document.getElementById('sides-instructions');
            if (!instr) return;
            if (visitedCategories.size === totalCategories) {
                instr.innerHTML = '<strong style="color: #2e7d32;">&#10003; Complete!</strong> You have reviewed all categories. Click <strong>"Test Your Knowledge"</strong> below to begin the challenge.';
            } else {
                instr.innerHTML = `Select each category to review our side items, desserts, drinks, and dipping cups. You must view all categories to unlock the knowledge challenge. <strong style="color: var(--brand-blue);">(Completed: ${visitedCategories.size} of ${totalCategories})</strong>`;
            }
        }

        function updateGameButtonState() {
            const gameBtn = document.getElementById('btn-start-game');
            if (!gameBtn) return;
            
            if (visitedCategories.size === totalCategories) {
                gameBtn.classList.remove('btn-disabled');
                gameBtn.style.pointerEvents = 'auto';
                gameBtn.removeAttribute('disabled');
            } else {
                gameBtn.classList.add('btn-disabled');
                gameBtn.style.pointerEvents = 'none';
                gameBtn.setAttribute('disabled', 'disabled');
            }
        }

        // --- RELATIONAL OVERVIEW LOGGING ---
        function sendOverviewProgress() {
            const market = localStorage.getItem('tw_market');
            const id = localStorage.getItem('tw_id');
            if (!market || !id) return;

            // Calculate slide overview reading duration in seconds
            const timeSpent = Math.floor((Date.now() - overviewStartTime) / 1000);
            
            // Marks progress as In Progress while sending initial time
            const url = `${AUTH_SCRIPT_URL}?action=update&market=${market}&id=${id}&module=Day%201%20Mod%203&timeSpent=${timeSpent}&answers=%7B%7D&status=In%20Progress`;
            
            console.log("SENDING OVERVIEW TIME: ", url);
            fetch(url, { method: 'GET', credentials: 'omit' });
        }

        function startMatchingGame() {
            // First, trigger background write of time spent reading slides
            sendOverviewProgress();
            
            const btn = document.getElementById('btn-start-game');
            if (btn) {
                btn.innerText = "Loading Challenge...";
                btn.style.pointerEvents = "none";
            }

            // Short buffer to guarantee delivery before redirecting to the game board
            setTimeout(() => {
                window.location.href = "module3_game.html";
            }, 1000);
        }

        // Initialize the first slide
        document.addEventListener("DOMContentLoaded", function() {
            renderSlide(0);
        });
    </script>
</body>
</html>
