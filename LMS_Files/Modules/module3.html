<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - Module 3</title>
    <link rel="icon" type="image/png" href="../../image/tile_blue.png">
    <link rel="stylesheet" href="../Globals/LMS_Global_Styles.css">
    <style>
        .classroom-container {
            max-width: 900px;
            margin: 2rem auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 6px solid var(--brand-blue);
        }

        .classroom-header {
            background: var(--crust-light);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--crust-med);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-title {
            font-family: 'OneDotCd-Bold';
            font-size: 1.8rem;
            color: var(--dark-blue);
            margin: 0;
            text-transform: uppercase;
        }

        .step-indicator {
            font-family: 'OneDotCd-Bold';
            color: var(--brand-blue);
            background: rgba(0, 144, 226, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .classroom-content {
            padding: 2rem;
            min-height: 400px; /* Keep height stable during transitions */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Step 1: Video --- */
        .video-wrapper {
            width: 100%;
            background: #000;
            aspect-ratio: 16/9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .mock-play-btn {
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .mock-play-btn:hover { transform: scale(1.1); }

        /* --- Step 2: Knowledge Check --- */
        .quiz-container {
            width: 100%;
            max-width: 600px;
            text-align: left;
        }

        .quiz-question {
            font-family: 'OneDotCd-Bold';
            font-size: 1.4rem;
            color: var(--crust-deep);
            margin-bottom: 1.5rem;
        }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--crust-base);
            border: 2px solid var(--crust-med);
            border-radius: 8px;
            font-family: 'OneDotCd';
            font-size: 1.1rem;
            color: var(--crust-deep);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .quiz-option:hover {
            border-color: var(--brand-blue);
            background: rgba(0, 144, 226, 0.05);
        }

        .quiz-option.selected {
            border-color: var(--brand-blue);
            background: var(--brand-blue);
            color: white;
        }

        /* --- Step 3: Prompt --- */
        .prompt-container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .prompt-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .prompt-text {
            font-size: 1.5rem;
            color: var(--crust-deep);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        /* --- Footer Controls --- */
        .classroom-footer {
            padding: 1.5rem 2rem;
            background: var(--crust-light);
            border-top: 2px solid var(--crust-med);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: var(--brand-blue);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-family: 'OneDotCd-Bold';
            text-decoration: none;
            transition: var(--transition);
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            width: auto;
        }

        .btn:hover {
            background: var(--dark-blue);
            transform: scale(1.05);
        }

        .btn-outline {
            background: transparent;
            color: var(--brand-blue);
            border: 2px solid var(--brand-blue);
        }
        
        .btn-outline:hover {
            background: rgba(0, 144, 226, 0.1);
            color: var(--dark-blue);
            transform: scale(1.02);
        }

        .btn-disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
            transform: none !important;
            color: #888 !important;
            border: none !important;
        }

        .hidden { display: none !important; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body style="background-color: var(--crust-light);">

    <div class="nav-strip" style="background-color: var(--dark-blue); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0.8rem 1rem;">
        <div style="max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <a href="../lms_dashboard.html#day1" class="back-link" style="color: var(--crust-base); text-decoration: none; font-family: 'OneDotCd-Bold'; font-size: 1.1rem;">
                &#8592; Back to Day 1
            </a>
            <span style="font-family: 'OneDotCd-Bold'; font-size: 1.2rem; color: var(--crust-base); text-transform: uppercase;">Module 3: Menu Overview</span>
        </div>
    </div>

    <div class="classroom-container">

        <div class="classroom-content">
            
        <!-- MENU DECONSTRUCTED SLIDESHOW -->
        <div id="menu-slideshow" style="background: var(--crust-base); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 900px; margin: 0.5rem auto 2rem auto; overflow: hidden; border: 2px solid var(--crust-med);">
            
            <!-- THIS IS THE MAGIC CONTAINER THE JS IS LOOKING FOR -->
            <div id="slide-content-container"></div>

            <!-- Controls Footer -->
            <div style="background: var(--crust-light); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--crust-med);">
                <span id="slide-counter" style="font-family: 'OneDotCd-Bold'; color: var(--crust-dark); font-size: 1.1rem;">Slide 1 of 4</span>
                <div>
                    <button id="btn-slide-prev" onclick="changeSlide(-1)" class="btn" style="background: var(--crust-base); color: var(--dark-blue); border: 2px solid var(--dark-blue); margin-right: 10px; display: none;">&#8592; Previous</button>
                    
                    <button id="btn-slide-next" onclick="changeSlide(1)" class="btn" style="background: var(--brand-blue); color: white; border: none;">Next &#8594;</button>
                    
                    <button id="btn-start-game" onclick="startMatchingGame()" class="btn" style="background: var(--brand-red); color: white; border: none; display: none;">Test Your Knowledge</button>
                </div>
            </div>
        </div>

    <script>
        // --- SLIDESHOW DATA ---
        const menuSlides = [
    {
        title: "Welcome to the Menu",
        type: "full-image",
        image: "../resources/Menu/Menu-Intro.png"
    },
    {
        title: "The Foundations: Crusts",
        type: "grid", // Tells the script to use the side-by-side layout
        items: [
            { name: "Hand Tossed", image: "../resources/Menu/Menu-HT.png", desc: "Garlic-oil seasoned rim. Our standard." },
            { name: "Parmesan Stuffed Crust", image: "../resources/Menu/Menu-PSC.png", desc: "Mozzarella cheese-stuffed rim." },
            { name: "Handmade Pan", image: "../resources/Menu/Menu-Pan.png", desc: "Thick, buttery, baked in a pan." },
            { name: "Crunchy Thin Crust", image: "../resources/Menu/Menu-TC.png", desc: "Thin and crispy." },
            { name: "New York Style", image: "../resources/Menu/Menu-NY.png", desc: "Thin and perfect for folding." },
            { name: "Gluten Free Crust", image: "../resources/Menu/Menu-GF.png", desc: "Certified free of gluten." }
        ]
    },
    {
        title: "The Sauces",
        type: "list", // <-- Use this instead of 'grid'
        items: [
            { name: "Robust Inspired Tomato Sauce", image: "../resources/Sauces/Tomato.png" },
            { name: "Honey BBQ Sauce", image: "../resources/Sauces/BBQ.png" },
            { name: "Garlic Parmesan Sauce", image: "../resources/Sauces/GP.png" },
            { name: "Alfredo Sauce", image: "../resources/Sauces/Alfredo.png" },
            { name: "Ranch", image: "../resources/Sauces/Ranch.png" },   
            // ...
        ]
    },
    {
        title: "Meats",
        type: "full-image",
        image: "../resources/Menu/Toppings-Meats.png"
    },
    {
        title: "Veggies & More (Part 1)",
        type: "full-image",
        image: "../resources/Menu/Toppings-Veggies1.png"
    },
    {
        title: "Veggies & More (Part 2)",
        type: "full-image",
        image: "../resources/Menu/Toppings-Veggies2.png"
    }
];

        let currentSlide = 0;

        // --- SLIDESHOW LOGIC ---
        function renderSlide(index) {
            const slide = menuSlides[index];
            const contentContainer = document.getElementById('slide-content-container');
            
            if (slide.type === 'grid') {
                // Render the 3-column grid layout (NO BOX-CEPTION)
                let gridHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem; text-align: left;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 1rem 0; text-transform: uppercase;">${slide.title}</h2>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 2rem 2rem 2rem;">`;
                
                slide.items.forEach(item => {
                    gridHTML += `
                        <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                            
                            <!-- Injected Title (Native Text) -->
                            <h3 style="font-family: 'Subhead2', sans-serif; color: var(--crust-deep); font-size: 1.4rem; margin: 0 0 8px 0;">${item.name}</h3>

                            <!-- The Canva image (cropped without text) -->
                            <img src="${item.image}" alt="${item.name}" style="width: 100%; max-width: 220px; object-fit: contain; margin-bottom: 10px;">
                            
                            <!-- Description text -->
                            <p style="font-family: 'OneDotCd'; color: var(--crust-deep); font-size: 1.05rem; margin: 0; line-height: 1.4;">${item.desc}</p>
                        </div>
                    `;
                });
                
                gridHTML += `</div>`;
                contentContainer.innerHTML = gridHTML;

            } else if (slide.type === 'list') {
                // Render the horizontal, 2-column list layout (for sauces/smaller items)
                let listHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 1rem 0; text-transform: uppercase;">${slide.title}</h2>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 2rem 2rem 2rem;">`;
                
                slide.items.forEach(item => {
                    listHTML += `
                        <div style="border: 1px solid var(--crust-med); border-radius: 8px; background: var(--crust-base); display: flex; align-items: center; overflow: hidden; height: 100px;">
                            
                            <!-- Image on the left -->
                            <div style="width: 100px; height: 100%; flex-shrink: 0; background: white; display: flex; align-items: center; justify-content: center;">
                                <img src="${item.image}" alt="${item.name}" style="max-width: 100%; max-height: 100%; object-fit: cover;">
                            </div>
                            
                            <!-- Text on the right -->
                            <div style="padding: 0 20px; flex-grow: 1;">
                                <h4 style="margin: 0; color: var(--crust-deep); font-family: 'Subhead2'; font-size: 1.4rem;">${item.name}</h4>
                            </div>
                        </div>
                    `;
                });
                
                listHTML += `</div>`;
                contentContainer.innerHTML = listHTML;

            } else if (slide.type === 'full-image') {
                // Render a single large graphic centered
                contentContainer.innerHTML = `
                    <div style="padding: 1.5rem 2rem 0.5rem 2rem; text-align: left;">
                        <h2 style="font-family: 'PizzaPress'; color: var(--med-blue); font-size: 2rem; margin: 0 0 1rem 0; text-transform: uppercase;">${slide.title}</h2>
                    </div>
                    <div style="padding: 0 2rem 2rem 2rem; display: flex; justify-content: center;">
                        <img src="${slide.image}" alt="${slide.title}" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    </div>
                `;
            } else {
                // Render your ORIGINAL left/right layout
                contentContainer.innerHTML = `
                    <div style="display: flex; flex-wrap: wrap;">
                        <div style="flex: 1 1 350px; background: var(--crust-light); display: flex; align-items: center; justify-content: center; padding: 2rem;">
                            <img src="${slide.image}" alt="${slide.title}" style="max-width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        </div>
                        <div style="flex: 1 1 350px; padding: 2.5rem; display: flex; flex-direction: column; justify-content: center;">
                            <h2 style="font-family: 'PizzaPress'; color: var(--dark-blue); font-size: 2.2rem; margin-top: 0; margin-bottom: 1rem;">${slide.title}</h2>
                            <div style="font-family: 'OneDotCd'; color: #333; font-size: 1.15rem; line-height: 1.6;">${slide.desc}</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('slide-counter').innerText = `Slide ${index + 1} of ${menuSlides.length}`;

            // Toggle Buttons
            document.getElementById('btn-slide-prev').style.display = index === 0 ? 'none' : 'inline-block';
            
            if (index === menuSlides.length - 1) {
                document.getElementById('btn-slide-next').style.display = 'none';
                document.getElementById('btn-start-game').style.display = 'inline-block';
            } else {
                document.getElementById('btn-slide-next').style.display = 'inline-block';
                document.getElementById('btn-start-game').style.display = 'none';
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            renderSlide(currentSlide);
        }

        function startMatchingGame() {
            // This will hide the slideshow and show the game board. 
            // We will wire this up next!
            document.getElementById('menu-slideshow').style.display = 'none';
            window.location.href = "module3_game.html";
        }

        // Initialize the first slide
        document.addEventListener("DOMContentLoaded", function() {
            renderSlide(0);
        });
    </script>
</body>
</html>
