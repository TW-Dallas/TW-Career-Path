        // --- AUTO ERROR REPORTING ---
        function reportErrorToDeveloper(errorType, details) {
            const market = localStorage.getItem('tw_market') || 'Unknown Market';

            const currentStepNum = typeof currentStep !== 'undefined' ? currentStep : 'N/A';
            
            // Create an informative payload
            const payload = {
                market: market,
                userId: id,
                module: 'Day 1 Mod 4 Practice',
                step: currentStepNum,
                errorType: errorType,
                details: details,
                userAgent: navigator.userAgent
            };

            const url = `${AUTH_SCRIPT_URL}?action=error&data=${encodeURIComponent(JSON.stringify(payload))}`;
            
            // Send it in the background
            fetch(url, { method: 'GET', credentials: 'omit' })
                .then(() => console.log("Error report sent successfully."))
                .catch(err => console.error("Could not send error report:", err));
        }

            reportErrorToDeveloper('JavaScript Exception', details);

        };

                instructionText.innerHTML = "<strong>Error:</strong> Could not load hitboxes. Check console.";
            });

        // Global advanceStep function capable of parsing any argument structure
        window.advanceStep = function(target) {
            let clickedId = "";

            if (typeof target === 'string') {
                // Case 1: ID string passed (e.g., onclick="advanceStep('hb-id')")
                clickedId = target;
            } else if (target && target.id) {
                // Case 2: Full DOM element passed (e.g., onclick="advanceStep(this)")
                clickedId = target.id;
            } else if (target && target.target) {
                // Case 3: Event object passed (e.g., onclick="advanceStep(event)")
                clickedId = target.target.id;
            } else if (window.event) {
                // Case 4: No arguments passed (e.g., onclick="advanceStep()"), fall back to browser event
                const eventTarget = window.event.currentTarget || window.event.target;
                if (eventTarget) {
                    clickedId = eventTarget.id;
                }
            } 

            const activeHitboxId = sequence[currentStep].activeHitbox;

            // If the clicked ID matches the active hitbox for the current step
            if (clickedId === activeHitboxId) {
                errorMsg.style.display = 'none'; 
                currentStep++; 
                loadStep(currentStep); 
            }
        };

        function initializeSimulator() {
            // Bind listeners to all hitboxes to guarantee execution if inline onclick is missing
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.addEventListener('click', function(e) {
                    advanceStep(this);
                });
            });

            // Tracks incorrect clicks on the background image
            posImage.addEventListener('click', function() {
                errorMsg.style.display = 'block';
                wrongClicks++; // Increment wrong clicks for Stage 2
            });

            // ---- NEW: JUMP TO STEP VIA URL QUERY PARAMETER ----
            const urlParams = new URLSearchParams(window.location.search);
            const stepParam = urlParams.get('step');
            
            if (stepParam !== null) {
                const targetStep = parseInt(stepParam, 10);
                // Ensure the step is a valid number within your sequence array limits
                if (!isNaN(targetStep) && targetStep >= 0 && targetStep < sequence.length) {
                    currentStep = targetStep;
                }
            }

            loadStep(currentStep);
        }

        function sendProgressUpdate(moduleName, status = "Completed") {
            const market = localStorage.getItem('tw_market');
            const id = localStorage.getItem('tw_id');
            if (!market || !id) return;

            const timeSpent = Math.floor((Date.now() - moduleStartTime) / 1000);
            
            // Capture Practice mistakes to merge with Tutorial mistakes
            const answers = {
                "Stage 2 Wrong Clicks": wrongClicks,
                "Stage 2 Status": "Finished Tutorial"
            };
            const answersStr = encodeURIComponent(JSON.stringify(answers));

            const url = `${AUTH_SCRIPT_URL}?action=update&market=${market}&id=${id}&module=${encodeURIComponent(moduleName)}&timeSpent=${timeSpent}&answers=${answersStr}&status=${status}`;
            
            console.log("SENDING STAGE 2 DATA: ", url);
            fetch(url, { method: 'GET', credentials: 'omit' });
        }

        function loadStep(stepIndex) {
            if (stepIndex >= sequence.length) {
                instructionText.innerHTML = "<strong>🎉 Simulation Complete!</strong><br><br>You've successfully completed this module.";
                posImage.src = "resources/POS_assets/Stage_1.1/under_construction.png";
                document.querySelectorAll('.hitbox').forEach(hb => hb.style.display = 'none');
                return;
            }

            const stepData = sequence[stepIndex];
            posImage.src = stepData.image;
            instructionText.innerHTML = stepData.instruction;
            
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.style.display = 'none';
            });
            
            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb) {
                activeHb.style.display = 'block';
                activeHb.classList.remove('arrow-bottom'); 

                if (stepIndex >= 39) { 
                    activeHb.classList.add('hide-arrow'); 
                } else {
                    activeHb.classList.remove('hide-arrow'); 
                }
            } else {
                // ---- NEW VALIDATION CHECK ----
                // If the sequence expects a hitbox but it isn't in your HTML file:
                reportErrorToDeveloper('Missing Hitbox Element', `Expected ID "${stepData.activeHitbox}" but it was not found in the DOM.`);
            }            

            const finishBtn = document.getElementById('finish-sim-btn');
            if (finishBtn) {
                if (stepIndex === sequence.length - 1) {
                    finishBtn.style.display = 'inline-block'; 
                } else {
                    finishBtn.style.display = 'none'; 
                }
            }
        }
        
        function endSimulation() {
            posImage.src = "resources/POS_assets/Stage_1.1/under_construction.png"; 
            instructionText.innerHTML = "<strong>Stage 2 Complete</strong><br><br>The next phase of the simulator is currently in development.<br><br>Click the red button below to save your progress and return to the Day 1 Dashboard.";
            document.querySelectorAll('.hitbox').forEach(hb => hb.style.display = 'none');
            
            const finishBtn = document.getElementById('finish-sim-btn');
            finishBtn.style.display = 'inline-block'; 
            finishBtn.innerText = "Save & Return to Day 1"; 

            finishBtn.onclick = function() {

                setTimeout(() => {
                    window.location.href = 'https://tw-dallas.github.io/TW-Career-Path/LMS_Files/lms_dashboard.html#day1';
                }, 1500);
            };
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                loadStep(currentStep);
            }        
        }

        function goNext() {
            if (currentStep < sequence.length - 1) {
                currentStep++;
                loadStep(currentStep);
            }
