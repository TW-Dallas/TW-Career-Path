<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Simulator - Module 3, Step 1.1</title>
<style>
  /* --- GLOBAL CRUST PALETTE --- */
  :root {
      --brand-red: #ff0000;
      --brand-blue: #0090e2;
      --dark-blue: #005c91;
      --crust-base: #fefaf6;
      --crust-light: #faf2e9;
      --crust-med: #f0decc;
      --crust-dark: #c0a588;
      --crust-deep: #603913;
  }

  body {
      font-family: 'Arial Narrow', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--crust-light);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--crust-deep);
  }

  /* --- MOBILE BLOCKER --- */
  #mobile-blocker {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--dark-blue); color: white;
      text-align: center; padding: 40px; z-index: 9999;
  }
  @media (max-width: 768px) {
      #mobile-blocker { display: flex; flex-direction: column; justify-content: center; }
      #simulator-wrapper { display: none !important; }
  }

  /* --- SPLIT VIEW LAYOUT --- */
  #simulator-wrapper {
      display: flex;
      width: 95%; max-width: 1400px;
      height: 75vh; /* 1. Locks the app so it NEVER bleeds off the bottom of your laptop */
      margin: 20px auto; 
      background: var(--crust-base);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden; /* Keeps your rounded corners */
      border: 2px solid var(--crust-med);
  }

  /* LEFT: Instructions Panel */
  #instruction-panel {
      flex-grow: 1; /* 2. Instead of a fixed 30%, this just flexibly fills whatever space is left */
      background: white;
      padding: 30px;
      border-right: 2px solid var(--crust-med);
      display: flex;
      flex-direction: column;
      overflow-y: auto; /* Adds a scrollbar ONLY to the text if it gets too small */
  }
  
  h2 { color: var(--dark-blue); margin-top: 0; text-transform: uppercase; border-bottom: 2px solid var(--brand-red); padding-bottom: 10px;}
  #instruction-text { font-size: 1.2rem; line-height: 1.6; margin-top: 20px; flex-grow: 1; }
  .error-msg { color: var(--brand-red); font-weight: bold; margin-top: 15px; display: none; }

  /* RIGHT: POS Screen */
  #pos-container {
      height: 100%; /* 3. Locks exactly to the wrapper's 85vh height */
      max-width: 75%; /* Prevents it from crushing the left panel on narrow screens */
      aspect-ratio: 1600 / 1200; /* 4. Locks the shape to your image. Your hitboxes are 100% safe. */
      background: #000;
      position: relative;
  }

  /* The actual POS Image */
  #pos-image {
      width: 100%;
      height: 100%;
      object-fit: cover; 
  }

  /* The wrapper that holds the image and hitboxes */
  #hitbox-wrapper {
      position: relative;
      display: inline-block; /* Wraps tightly around the image */
  }

  /* --- HITBOXES (Invisible with Arrows) --- */
  .hitbox {
      position: absolute;
      cursor: pointer;
      display: none; /* Hidden by default, activated per step */
      z-index: 10;
      /* Remove visible borders */
      background: transparent;
      border: none;
  }
  
  /* The Bouncing Arrow (SVG) */
  .hitbox::before {
      content: '';
      position: absolute;
      top: -50px; /* Sits completely above the button */
      left: 50%;
      transform: translateX(-50%);
      width: 40px; /* Fat width */
      height: 40px; /* Short tail */
      /* Base64 encoded SVG of a fat, short arrow */
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff0000"><path d="M12 21l-9-9h6V3h6v9h6z"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
      animation: bounce 1s infinite;
      animation-delay: 1s; /* DELAYS THE BOUNCE */
      opacity: 0; /* STARTS INVISIBLE */
      animation-fill-mode: forwards; /* STAYS VISIBLE ONCE IT APPEARS */
      pointer-events: none;
  }

  @keyframes bounce {
      0% { top: -50px; opacity: 1; }
      50% { top: -35px; opacity: 1; }
      100% { top: -50px; opacity: 1; }
  }

    /* The "Flip to Bottom" override */
  .hitbox.arrow-bottom::before {
      top: auto; /* Kills the top positioning */
      bottom: -50px; /* Moves it below */
      transform: translateX(-50%) rotate(180deg); /* Flips it up */
      animation: bounceBottomUp 1s infinite;
      animation-delay: 1s; /* DELAYS THE BOUNCE */
      opacity: 0; /* STARTS INVISIBLE */
      animation-fill-mode: forwards; /* STAYS VISIBLE ONCE IT APPEARS */
  }
  
  @keyframes bounceBottomUp {
      0% { bottom: -50px; opacity: 1; }
      50% { bottom: -35px; opacity: 1; } 
      100% { bottom: -50px; opacity: 1; }
  }
</style>
  
    <!-- 2. LINK TO YOUR GLOBAL HITBOXES CSS -->
    <link rel="stylesheet" href="Globals/LMS_Master_hitboxes.css">

</head>
<body>

    <!-- Mobile Blocker (From your global CSS) -->
    <div id="mobile-blocker">
        <h2>Desktop Required</h2>
        <p>This POS simulator requires a larger screen. Please rotate your device or use a computer.</p>
    </div>

    <!-- Main Wrapper -->
    <div id="simulator-wrapper">
        
        <!-- LEFT: Instructions Panel -->
        <div id="instruction-panel">
            <h2>MODULE 3: ORDER ENTRY</h2>
            <h3 style="color: var(--crust-dark); font-family: 'OneDotCd', sans-serif; margin-top: -10px;">Stage 1.1: Order Taking Practice</h3>
            <div id="instruction-text">
                <!-- JavaScript will inject the text/tickets here -->
            </div>
            <div id="error-message" class="error-msg">❌ Incorrect Click. Try again.</div>
        </div>

        <!-- RIGHT: POS Screen & Hitboxes -->
        <div id="pos-container">
            <div id="hitbox-wrapper">
                <!-- The dynamically changing background image -->
                <img id="pos-image" src="" alt="POS Screen">

                <!-- 3. HITBOXES WILL BE INJECTED HERE BY JAVASCRIPT -->
                
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT FOR STAGE 0 -->
    <script>
        // Sequence Data
        const sequence = [
            {
                step: 0,
                image: "resources/POS_assets/Stage_0/POS_1.png",
                activeHitbox: "hb-order-entry",
                instruction: "Welcome to the POS Simulator. Before we can take an order, we need to access the system.<br><br>👉 <strong>Action:</strong> Click the 'Order Entry' button on the top left."
            },
            {
                step: 1,
                image: "resources/POS_assets/Stage_0/POS_2.png",
                activeHitbox: "hb-time-clock",
                instruction: "This is the Caller ID screen. Before you can log in, you must clock in for your shift.<br><br>👉 <strong>Action:</strong> Click the blue 'Time Clock' button at the bottom."
            },
            {
                step: 2,
                image: "resources/POS_assets/Stage_0/POS_3.png",
                activeHitbox: "hb-numpad-ok", 
                instruction: "Enter your employee ID using the keypad, then click OK.<br><br>👉 <strong>Action:</strong> For this practice, assume your ID is already entered. Click the green 'OK' checkmark."
            },
            {
                step: 3,
                image: "resources/POS_assets/Stage_0/POS_4.png",
                activeHitbox: "hb-pink-clock",
                instruction: "Verify your shift details on the right.<br><br>👉 <strong>Action:</strong> Click the pink 'Clock In' icon at the top left to confirm."
            },
            {
                step: 4,
                image: "resources/POS_assets/Stage_0/POS_5.png",
                activeHitbox: "hb-qwerty-enter",
                instruction: "Enter your secure password.<br><br>👉 <strong>Action:</strong> Assume your password is entered. Click the 'Enter' door icon to finalize clock-in."
            },
            {
                step: 5,
                image: "resources/POS_assets/Stage_0/POS_2.png", 
                activeHitbox: "hb-log-in", 
                instruction: "Excellent. You are now clocked in.<br><br>Now you must log in to access the order taking capabilities.<br><br>👉 <strong>Action:</strong> Click the green 'Log In' button in the bottom left corner."
            },
            {
                step: 6,
                image: "resources/POS_assets/Stage_0/POS_6.png", 
                activeHitbox: "hb-log-in-OK", 
                instruction: "Enter your employee ID again to log in.<br><br>👉 <strong>Action:</strong> Assume your ID is entered. Click the green 'OK' checkmark."
            },
            {
                step: 7,
                image: "resources/POS_assets/Stage_0/POS_7.png", 
                activeHitbox: "hb-carryout", 
                instruction: "You are now fully logged in.<br><br>Let's review the main sections of this screen before taking an order.<br><br><ul><li><strong>Caller ID Lines (Orange):</strong> These display incoming phone calls.</li><li><strong>Training Mode (Top Right):</strong> Used to practice orders without sending them to the kitchen.</li><li><strong>Carryout (Bottom Right):</strong> Used for walk-in customers at the counter.</li></ul><br>👉 <strong>Action:</strong> For today's practice, click the orange 'Carryout' button."
            },
            {
                step: 8,
                image: "resources/POS_assets/Stage_0/POS_8.png", 
                activeHitbox: "hb-cust-add", 
                instruction: "You are now on the Greetings/Specials page.<br><br>Every order begins by verifying the customer's information.<br><br>👉 <strong>Action:</strong> Click the 'Customer Address' tab on the right."
            },
            {
                step: 9,
                image: "resources/POS_assets/Stage_0/POS_9.png",
                activeHitbox: "hb-phone-field", 
                instruction: "This is the Customer Address screen.<br><br>👉 <strong>Action:</strong> Click the 'Phone #' field to begin entering the customer's information."
            },
            {
                step: 10,
                image: "resources/POS_assets/Stage_0/POS_10.png",
                activeHitbox: "hb-address-section", 
                instruction: "The customer's information pops up, but notice the incorrect address and the warning indicators at the bottom and right of the screen.<br><br>👉 <strong>Action:</strong> Click the address section to populate the safe address."
            },
            {
                step: 11,
                image: "resources/POS_assets/Stage_0/POS_11.png",
                activeHitbox: "hb-rewards-checker", 
                instruction: "The address is now marked as safe. However, there is a warning that the Rewards status is missing.<br><br>👉 <strong>Action:</strong> Click the 'Rewards Status' button."
            },
            {
                step: 12,
                image: "resources/POS_assets/Stage_0/POS_12.png",
                activeHitbox: "hb-rewards-ok", 
                instruction: "Click <strong>OK</strong> to search for accounts listed under the current phone number. Click <strong>Not a Rewards Customer</strong> if no results are found.<br><br>👉 <strong>Action:</strong> Click 'OK' to close the popup."
            },
            {
                step: 13,
                image: "resources/POS_assets/Stage_0/POS_13.png",
                activeHitbox: "hb-greeting-tab", 
                instruction: "The address section is now completely correct and verified.<br><br>👉 <strong>Action:</strong> Click the 'Greetings/Specials' tab on the right to return to the main menu."
            },
            {
                step: 14,
                image: "resources/POS_assets/Stage_0/POS_14.png",
                activeHitbox: "hb-delivery-service", 
                instruction: "Now we need to choose the service method for this order.<br><br>👉 <strong>Action:</strong> Click the 'Delivery' button."
            },
            {
                step: 15,
                image: "resources/POS_assets/Stage_0/POS_15.png",
                activeHitbox: "hb-pizzas-tab", 
                instruction: "Delivery is now selected. Notice that both arrows on the right are now green, meaning we are ready to proceed.<br><br>👉 <strong>Action:</strong> Click the 'Pizzas' tab."
            },
            {
                step: 16,
                image: "resources/POS_assets/Stage_0/POS_16.png", 
                activeHitbox: "hb-size-14", 
                instruction: "This is the Pizza Builder.<br><br>Notice that 'Original Sauce' and 'Pizza Cheese' are selected by default. You build a pizza from top to bottom: Size, Crust, then Toppings.<br><br>👉 <strong>Action:</strong> Select the 14-inch size."
            },
            {
                step: 17,
                image: "resources/POS_assets/Stage_0/POS_17.png", 
                activeHitbox: "hb-crust-hand-tossed", 
                instruction: "Notice the red 'Missing Crust' banner? The system will always flag incomplete items.<br><br>👉 <strong>Action:</strong> Resolve the error by clicking the 'Hand Tossed' crust option."
            },
            {
                step: 18,
                image: "resources/POS_assets/Stage_0/POS_18.png", 
                activeHitbox: "hb-pepperoni", 
                instruction: "Excellent. The crust error is resolved. Since sauce and cheese are already selected, this is a complete cheese pizza.<br><br>Let's add a topping.<br><br>👉 <strong>Action:</strong> Click the 'Pepperoni' button."
            },
            {
                step: 19,
                image: "resources/POS_assets/Stage_0/POS_19.png",
                activeHitbox: "hb-half-and-half", 
                instruction: "The Pepperoni button turns orange, and the topping is added to the receipt on the left.<br><br>Now let's explore the sub-menus at the bottom.<br><br>👉 <strong>Action:</strong> Click the 'Half and Half' tab."
            },
            {
                step: 20,
                image: "resources/POS_assets/Stage_0/POS_20.png",
                activeHitbox: "hb-specialty", 
                instruction: "This is the Half and Half page.<br><br>👉 <strong>Action:</strong> Click the 'Specialty' tab."
            },
            {
                step: 21,
                image: "resources/POS_assets/Stage_0/POS_21.png",
                activeHitbox: "hb-cooking-instructions", 
                instruction: "This is the Specialty pizzas page.<br><br>👉 <strong>Action:</strong> Click the 'Cooking Instructions' tab."
            },
            {
                step: 22,
                image: "resources/POS_assets/Stage_0/POS_22.png",
                activeHitbox: "hb-everything-else-tab", 
                instruction: "This is the Cooking Instructions page, where you can specify well-done, light bake, etc.<br><br>👉 <strong>Action:</strong> Click the 'Everything Else' tab on the right to leave the pizza builder."
            },
            {
                step: 23,
                image: "resources/POS_assets/Stage_0/POS_23.png",
                activeHitbox: "hb-coupons-tab", 
                instruction: "This is the 'Everything Else' tab. This is where you will find Breads, Desserts, Wings, Drinks, and other non-pizza items.<br><br>👉 <strong>Action:</strong> Click the 'Coupons' tab on the right."
            },
            {
                step: 24,
                image: "resources/POS_assets/Stage_0/POS_24.png", 
                activeHitbox: "hb-payments-tab", 
                instruction: "This is the Coupons tab. You can select coupons from the list or use the 'Find Coupon by Code' button at the top.<br><br>👉 <strong>Action:</strong> Click the 'Payments' tab on the right to proceed."
            },
            {
                step: 25,
                image: "resources/POS_assets/Stage_0/POS_25.png",
                activeHitbox: "hb-cash-later", 
                instruction: "This is the Payments screen. Here you will see the final total and select the payment method.<br><br>👉 <strong>Action:</strong> Click the 'Cash (Later)' button since this is a delivery order."
            },
            {
                step: 26,
                image: "resources/POS_assets/Stage_0/POS_26.png",
                activeHitbox: "hb-finish-tab", 
                instruction: "Payment method selected.<br><br>👉 <strong>Action:</strong> Click the 'Finish' tab on the bottom right."
            },
            {
                step: 27,
                image: "resources/POS_assets/Stage_0/POS_27.png",
                activeHitbox: "hb-finish-checkout", 
                instruction: "Order Complete.<br><br>👉 <strong>Action:</strong> Click 'Accept' to return to the main screen."
            },
            {
                step: 28,
                image: "resources/POS_assets/Stage_0/POS_7.png", 
                activeHitbox: "hb-todays-orders-tab", 
                instruction: "You are back on the main screen, ready for the next customer.<br><br>Now let's look at a few administrative tabs.<br><br>👉 <strong>Action:</strong> Click the 'Today's Orders' tab."
            },
            {
                step: 29,
                image: "resources/POS_assets/Stage_0/POS_28.png", 
                activeHitbox: "hb-quick-payments-tab", 
                instruction: "This is the Today's Orders tab. Here, you can see all orders that have been placed since open. You can filter the results as well as search for specific information, such as phone number, address, or name.<br>You can also find information regarding order status.<br><br>👉 <strong>Action:</strong> Click the 'Quick Payments' tab."
            },
            {
                step: 30,
                image: "resources/POS_assets/Stage_0/POS_29.png", 
                activeHitbox: "hb-caller-ID", 
                instruction: "This is the Quick Payments tab.<br>This tab contains all cash orders that have not been paid for. It is important to check here for carryout customers.<br><br>👉 <strong>Action:</strong> Click on the <strong>Caller ID</strong> button to go back to the main screen. We'll practice some examples next."
            }
        ];

        let currentStep = 0;
        const posImage = document.getElementById('pos-image');
        const instructionText = document.getElementById('instruction-text');
        const errorMsg = document.getElementById('error-message');
        const hitboxWrapper = document.getElementById('hitbox-wrapper');

        // 🔥 FETCH THE GLOBAL HITBOXES AUTOMATICALLY 🔥
        fetch('Globals/LMS_Master_html.html')
            .then(response => response.text())
            .then(html => {
                // Append the fetched buttons to the wrapper
                hitboxWrapper.insertAdjacentHTML('beforeend', html);
                
                // Now that the hitboxes exist, start the simulator!
                initializeSimulator();
            })
            .catch(error => {
                console.error("Error loading hitboxes:", error);
                instructionText.innerHTML = "<strong>Error:</strong> Could not load hitboxes. Check console.";
            });

        function initializeSimulator() {
            // Add event listeners to ALL hitboxes
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.addEventListener('click', function(e) {
                    // If they clicked the correct one...
                    if (this.id === sequence[currentStep].activeHitbox) {
                        errorMsg.style.display = 'none'; // Hide any previous error
                        currentStep++; // Move to next step
                        loadStep(currentStep); // Load it
                    } 
                });
            });

            // Add a click listener to the image itself to catch WRONG clicks
            posImage.addEventListener('click', function() {
                errorMsg.style.display = 'block';
                // Optional: Shake the screen or play a sound
                setTimeout(() => { errorMsg.style.display = 'none'; }, 2000);
            });

            // Start the first step
            loadStep(0);
        }

        function loadStep(stepIndex) {
            if (stepIndex >= sequence.length) {
                instructionText.innerHTML = "<strong>🎉 Simulation Complete!</strong><br><br>You've successfully completed this module.";
                posImage.src = "";
                document.querySelectorAll('.hitbox').forEach(hb => hb.style.display = 'none');
                return;
            }

            const stepData = sequence[stepIndex];
            
            // 1. Update Image
            posImage.src = stepData.image;
            
            // 2. Update Instructions
            instructionText.innerHTML = stepData.instruction;
            
            // 3. Hide all hitboxes
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.style.display = 'none';
            });
            
            // 4. Show the active hitbox for this step
            const activeHb = document.getElementById(stepData.activeHitbox);

            if (activeHb) {
                activeHb.style.display = 'block';

                // If it's Step 0, flip the arrow to the bottom
                if (stepIndex === 0) {
                    activeHb.classList.add('arrow-bottom');
                } else {
                    // Ensure it's removed for all other steps just in case
                    activeHb.classList.remove('arrow-bottom'); 
                }
            } else {
                console.warn("Hitbox not found: " + stepData.activeHitbox);
            }

        }
    </script>
</body>
</html>
