// --- RELATIONAL TRACKING STATE ---
        const moduleStartTime = Date.now();
        let currentStep = 0;
        let wrongClicks = 0;
        const AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRM9OqqGMhDmrssDQ3MMEleWEsWbYra9xtuwlJJYLct4WeBA5j15B53Bzcmla54Pcfig/exec';

        const posImage = document.getElementById('pos-image');
        const instructionText = document.getElementById('instruction-text');
        const errorMsg = document.getElementById('error-message');
        const hitboxWrapper = document.getElementById('hitbox-wrapper');

        // Fetch the global hitboxes automatically
        fetch('Globals/LMS_Master_html.html')
            .then(response => response.text())
            .then(html => {
                hitboxWrapper.insertAdjacentHTML('beforeend', html);
                initializeSimulator();
            })
            .catch(error => {
                console.error("Error loading hitboxes:", error);
                instructionText.innerHTML = "<strong>Error:</strong> Could not load hitboxes. Check console.";
            });

        // Global advanceStep function capable of parsing any argument structure
        window.advanceStep = function(target) {
            let clickedId = "";

            if (typeof target === 'string') {
                // Case 1: ID string passed (e.g., onclick="advanceStep('hb-id')")
                clickedId = target;
            } else if (target && target.id) {
                // Case 2: Full DOM element passed (e.g., onclick="advanceStep(this)")
                clickedId = target.id;
            } else if (target && target.target) {
                // Case 3: Event object passed (e.g., onclick="advanceStep(event)")
                clickedId = target.target.id;
            } else if (window.event) {
                // Case 4: No arguments passed (e.g., onclick="advanceStep()"), fall back to browser event
                const eventTarget = window.event.currentTarget || window.event.target;
                if (eventTarget) {
                    clickedId = eventTarget.id;
                }
            }

            const activeHitboxId = sequence[currentStep].activeHitbox;

            // If the clicked ID matches the active hitbox for the current step
            if (clickedId === activeHitboxId) {
                errorMsg.style.display = 'none'; 
                currentStep++; 
                loadStep(currentStep); 
            }
        };

        function initializeSimulator() {
            // Bind listeners to all hitboxes to guarantee execution if inline onclick is missing
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.addEventListener('click', function(e) {
                    advanceStep(this);
                });
            });

            // Tracks incorrect clicks on the background image
            posImage.addEventListener('click', function() {
                errorMsg.style.display = 'block';
                wrongClicks++; // Increments the error counter
            });

            loadStep(0);
        }

        function sendProgressUpdate(moduleName, status = "In Progress") {
            const market = localStorage.getItem('tw_market');
            const id = localStorage.getItem('tw_id');
            if (!market || !id) return;

            const timeSpent = Math.floor((Date.now() - moduleStartTime) / 1000);
            
            // Build the starting object for Module 4 Answers
            const answers = {
                "Stage 0 Wrong Clicks": wrongClicks,
                "Stage 0 Status": "Completed Tutorial"
            };
            const answersStr = encodeURIComponent(JSON.stringify(answers));

            const url = `${AUTH_SCRIPT_URL}?action=update&market=${market}&id=${id}&module=${encodeURIComponent(moduleName)}&timeSpent=${timeSpent}&answers=${answersStr}&status=${status}`;
            
            console.log("SENDING STAGE 0 DATA: ", url);
            fetch(url, { method: 'GET', credentials: 'omit' });
        }

        function loadStep(stepIndex) {
            if (stepIndex >= sequence.length) {
                // Write progress before redirecting
                sendProgressUpdate('Day 1 Mod 4', 'In Progress');

                // Redirect to Stage 2 after 1 second buffer
                setTimeout(() => {
                    window.location.href = "POS_Simulator_Stage_2.html";
                }, 1000);
                return;
            }

            const stepData = sequence[stepIndex];
            posImage.src = stepData.image; 
            instructionText.innerHTML = stepData.instruction;
            
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.style.display = 'none';
            });
            
            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb) {
                activeHb.style.display = 'block';
                if (stepIndex === 0) {
                    activeHb.classList.add('arrow-bottom');
                } else {
                    activeHb.classList.remove('arrow-bottom'); 
                }
                activeHb.classList.remove('hide-arrow'); 
            } else {
                // ---- NEW VALIDATION CHECK ----
                // If the sequence expects a hitbox but it isn't in your HTML file:
                reportErrorToDeveloper('Missing Hitbox Element', `Expected ID "${stepData.activeHitbox}" but it was not found in the DOM.`);
            }
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                loadStep(currentStep);
            }        
        }
    </script>
