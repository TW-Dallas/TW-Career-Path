                "image": "resources/POS_assets/Stage_0/POS_25.png",

                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Tutorial</p><p style='margin-bottom: 16px;'><strong>Checking Out</strong></p><p style='margin-bottom: 24px;'>This is the Payments screen. Here you will see the final total and select the payment method.</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>💳 PAYMENT METHOD</div><strong>Method:</strong> Cash (Later)</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the 'Cash (Later)' button since this is a delivery order.</p>"
            },
            {
                "step": 27,
                "image": "resources/POS_assets/Stage_0/POS_26.png",
                "activeHitbox": "hb-finish-tab",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Tutorial</p><p style='margin-bottom: 16px;'><strong>Order Review Confirmation</strong></p><p style='margin-bottom: 24px;'>Payment method selected.</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>💳 PAYMENT METHOD</div><strong>Method:</strong> Cash (Later)</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the 'Finish' tab on the bottom right.</p>"
            },
            {
                "step": 28,
                "image": "resources/POS_assets/Stage_0/POS_27.png",
                "activeHitbox": "hb-finish-checkout",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Tutorial</p><p style='margin-bottom: 16px;'><strong>Order Completed Review</strong></p><p style='margin-bottom: 24px;'>Order Complete.</p><div class='pos-ticket' style='margin-bottom: 16px;'><div class='pos-ticket-header'>📋 CUSTOMER DETAILS</div><strong>Phone:</strong> (000) 000-0000<br><strong>Name:</strong> Training<br><strong>Address:</strong> 4550 Eldorado Pkwy, McKinney, TX 75070<div class='pos-ticket-header' style='margin-top: 12px;'>📋 SERVICE METHOD</div><strong>Type:</strong> Delivery<div class='pos-ticket-header' style='margin-top: 12px;'>🍴 ORDER ITEMS</div><span style='color: var(--med-blue); margin-right: 4px; font-weight: bold;'>•</span> 14\" Hand-Tossed — Pepperoni<div class='pos-ticket-header' style='margin-top: 12px;'>💳 PAYMENT METHOD</div><strong>Method:</strong> Cash (Later)</div><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click 'Accept' to return to the main screen.</p>"
            },
            {
                "step": 29,
                "image": "resources/POS_assets/Stage_0/POS_7.png",
                "activeHitbox": "hb-todays-orders-tab",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Tutorial</p><p style='margin-bottom: 16px;'><strong>Administrative Modules</strong></p><p style='margin-bottom: 24px;'>You are back on the main screen, ready for the next customer.<br><br>Now let's look at a few administrative tabs.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the 'Today's Orders' tab.</p>"
            },
            {
                "step": 30,
                "image": "resources/POS_assets/Stage_0/POS_28.png",
                "activeHitbox": "hb-quick-payments-tab",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Tutorial</p><p style='margin-bottom: 16px;'><strong>Audit Records Ledger</strong></p><p style='margin-bottom: 24px;'>This is the Today's Orders tab. Here, you can see all orders that have been placed since the store opened. You can filter the results as well as search for specific information, such as phone number, address, or name.<br>You can also find information regarding order status.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click the 'Quick Payments' tab.</p>"
            },
            {
                "step": 31,
                "image": "resources/POS_assets/Stage_0/POS_29.png",
                "activeHitbox": "hb-caller-ID",
                "instruction": "<p style='font-size: 0.85rem; color: #8085a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;'>Tutorial</p><p style='margin-bottom: 16px;'><strong>Pending Ledger Clearances</strong></p><p style='margin-bottom: 24px;'>This is the Quick Payments tab.<br>This tab contains all cash orders that have not been paid for. It is important to check here for carryout customers.</p><p style='font-size: 1rem; margin-top: 24px;'>👉 <strong>Action:</strong> Click on the <strong>Caller ID</strong> button to go back to the main screen. We'll practice some examples next.</p>"
            }
        ];

        // --- RELATIONAL TRACKING STATE ---
        const moduleStartTime = Date.now();
        let currentStep = 0;
        let wrongClicks = 0;
        const AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRM9OqqGMhDmrssDQ3MMEleWEsWbYra9xtuwlJJYLct4WeBA5j15B53Bzcmla54Pcfig/exec';

        const posImage = document.getElementById('pos-image');
        const instructionText = document.getElementById('instruction-text');
        const errorMsg = document.getElementById('error-message');
        const hitboxWrapper = document.getElementById('hitbox-wrapper');

        // Fetch the global hitboxes automatically
        fetch('Globals/LMS_Master_html.html')
            .then(response => response.text())
            .then(html => {
                hitboxWrapper.insertAdjacentHTML('beforeend', html);
                initializeSimulator();
            })
            .catch(error => {
                console.error("Error loading hitboxes:", error);
                instructionText.innerHTML = "<strong>Error:</strong> Could not load hitboxes. Check console.";
            });

        // Global advanceStep function capable of parsing any argument structure
        window.advanceStep = function(target) {
            let clickedId = "";

            if (typeof target === 'string') {
                // Case 1: ID string passed (e.g., onclick="advanceStep('hb-id')")
                clickedId = target;
            } else if (target && target.id) {
                // Case 2: Full DOM element passed (e.g., onclick="advanceStep(this)")
                clickedId = target.id;
            } else if (target && target.target) {
                // Case 3: Event object passed (e.g., onclick="advanceStep(event)")
                clickedId = target.target.id;
            } else if (window.event) {
                // Case 4: No arguments passed (e.g., onclick="advanceStep()"), fall back to browser event
                const eventTarget = window.event.currentTarget || window.event.target;
                if (eventTarget) {
                    clickedId = eventTarget.id;
                }
            }

            const activeHitboxId = sequence[currentStep].activeHitbox;

            // If the clicked ID matches the active hitbox for the current step
            if (clickedId === activeHitboxId) {
                errorMsg.style.display = 'none'; 
                currentStep++; 
                loadStep(currentStep); 
            }
        };

        // --- AUDIO COMPONENT ENGINE ---
        const audioPlayer = document.getElementById('global-audio-player');
        const audioPanel = document.getElementById('audio-control-panel');

        let completedTracks = new Set();
        let currentPlayingTrackIndex = null;

        function handleAudioForStep(stepData) {
            completedTracks.clear();
            currentPlayingTrackIndex = null;

            if (!stepData.audio) {
                if (audioPanel) audioPanel.style.display = 'none';
                if (audioPlayer) audioPlayer.pause();
                return;
            }

            if (audioPanel) audioPanel.style.display = 'block';

            const tracks = stepData.audio.tracks || [
                { id: "track-0", label: "Live Call", file: stepData.audio.file }
            ];

            const isSequential = stepData.audio.sequential !== false && tracks.length > 1;
            const requireAll = stepData.audio.requireAllPlayed === true || tracks.length > 1;

            let html = `<div class="audio-header"><span class="audio-pulse-indicator"></span> Live Audio Call</div>`;
            html += `<div class="audio-track-stack">`;

            tracks.forEach((track, index) => {
                const isLocked = isSequential && index > 0;
                const lockClass = isLocked ? 'locked' : '';
                const lockIcon = isLocked ? '🔒 ' : '';

                html += `
                    <div id="track-row-${index}" class="audio-track-row ${lockClass}">
                        <div class="track-label">${lockIcon}${track.label}</div>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <span id="badge-track-${index}" class="track-badge pending">Unheard</span>
                            <button id="btn-track-${index}" class="audio-btn" style="padding: 4px 10px; font-size: 0.8rem;" 
                                ${isLocked ? 'disabled' : ''} onclick="playTrack(${index})">
                                ▶ Play
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            if (audioPanel) audioPanel.innerHTML = html;

            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb && requireAll) {
                activeHb.style.display = 'none';
            }
        }

        function playTrack(index) {
            const stepData = sequence[currentStep];
            const tracks = stepData.audio.tracks || [
                { id: "track-0", label: "Live Call", file: stepData.audio.file }
            ];

            const targetTrack = tracks[index];

            if (currentPlayingTrackIndex === index && !audioPlayer.paused) {
                audioPlayer.pause();
                updateTrackUI(index, 'paused');
                return;
            }

            audioPlayer.src = targetTrack.file;
            audioPlayer.play();
            currentPlayingTrackIndex = index;

            tracks.forEach((_, i) => {
                if (i === index) {
                    updateTrackUI(i, 'playing');
                } else if (!completedTracks.has(i)) {
                    updateTrackUI(i, 'pending');
                }
            });

            audioPlayer.onended = function() {
                completedTracks.add(index);
                updateTrackUI(index, 'complete');

                const nextIndex = index + 1;
                if (tracks[nextIndex]) {
                    const nextRow = document.getElementById(`track-row-${nextIndex}`);
                    const nextBtn = document.getElementById(`btn-track-${nextIndex}`);
                    if (nextRow && nextBtn) {
                        nextRow.classList.remove('locked');
                        nextBtn.disabled = false;
                        const labelEl = nextRow.querySelector('.track-label');
                        if (labelEl) labelEl.innerText = tracks[nextIndex].label;
                    }
                }

                if (completedTracks.size === tracks.length) {
                    const activeHb = document.getElementById(stepData.activeHitbox);
                    if (activeHb) {
                        activeHb.style.display = 'block';
                    }
                }
            };
        }

        function updateTrackUI(index, state) {
            const badge = document.getElementById(`badge-track-${index}`);
            const btn = document.getElementById(`btn-track-${index}`);
            if (!badge || !btn) return;

            if (state === 'playing') {
                badge.className = 'track-badge playing';
                badge.innerText = 'Playing';
                btn.innerHTML = '⏸ Pause';
            } else if (state === 'paused') {
                badge.className = 'track-badge pending';
                badge.innerText = 'Paused';
                btn.innerHTML = '▶ Resume';
            } else if (state === 'complete') {
                badge.className = 'track-badge complete';
                badge.innerText = '✓ Complete';
                btn.innerHTML = '🔄 Replay';
            } else if (state === 'pending') {
                badge.className = 'track-badge pending';
                badge.innerText = 'Unheard';
                btn.innerHTML = '▶ Play';
            }
        }

        function initializeSimulator() {
            // Bind listeners to all hitboxes to guarantee execution if inline onclick is missing
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.addEventListener('click', function(e) {
                    advanceStep(this);
                });
            });

            // Tracks incorrect clicks on the background image
            posImage.addEventListener('click', function() {
                errorMsg.style.display = 'block';
                wrongClicks++; // Increments the error counter
            });

            // ---- NEW: JUMP TO STEP VIA URL QUERY PARAMETER ----
            const urlParams = new URLSearchParams(window.location.search);
            const stepParam = urlParams.get('step');
            
            if (stepParam !== null) {
                const targetStep = parseInt(stepParam, 10);
                // Ensure the step is a valid number within your sequence array limits
                if (!isNaN(targetStep) && targetStep >= 0 && targetStep < sequence.length) {
                    currentStep = targetStep;
                }
            }

            loadStep(currentStep);
        }

        function sendProgressUpdate(moduleName, status = "In Progress") {
            const market = localStorage.getItem('tw_market');
            const id = localStorage.getItem('tw_id');
            if (!market || !id) return;

            const timeSpent = Math.floor((Date.now() - moduleStartTime) / 1000);
            
            // Build the starting object for Module 4 Answers
            const answers = {
                "Stage 0 Wrong Clicks": wrongClicks,
                "Stage 0 Status": "Completed Tutorial"
            };
            const answersStr = encodeURIComponent(JSON.stringify(answers));

            const url = `${AUTH_SCRIPT_URL}?action=update&market=${market}&id=${id}&module=${encodeURIComponent(moduleName)}&timeSpent=${timeSpent}&answers=${answersStr}&status=${status}`;
            
            console.log("SENDING STAGE 0 DATA: ", url);
            fetch(url, { method: 'GET', credentials: 'omit' });
        }

        function loadStep(stepIndex) {
            if (stepIndex >= sequence.length) {
                sendProgressUpdate('Day 1 Mod 4', 'In Progress');
                setTimeout(() => {
                    window.location.href = "POS_Simulator_Stage_1.html";
                }, 1000);
                return;
            }

            const stepData = sequence[stepIndex];
            posImage.src = stepData.image; 
            instructionText.innerHTML = stepData.instruction;
            
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.style.display = 'none';
            });
            
            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb) {
                activeHb.style.display = 'block';
                
                // Flip arrow to bottom on Steps 0 and 1, top for all other steps
                if (stepIndex === 0 || stepIndex === 1) {
                    activeHb.classList.add('arrow-bottom');
                } else {
                    activeHb.classList.remove('arrow-bottom'); 
                }
                
                activeHb.classList.remove('hide-arrow'); 
            } else {
                reportErrorToDeveloper('Missing Hitbox Element', `Expected ID "${stepData.activeHitbox}" but it was not found in the DOM.`);
            }

            // TRIGGER AUDIO FOR THE STEP:
            handleAudioForStep(stepData);
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                loadStep(currentStep);
            }        
        }
    </script>
