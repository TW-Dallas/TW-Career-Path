        let currentStep = 0;
        const posImage = document.getElementById('pos-image');
        const instructionText = document.getElementById('instruction-text');
        const errorMsg = document.getElementById('error-message');
        const hitboxWrapper = document.getElementById('hitbox-wrapper');

        // 🔥 FETCH THE GLOBAL HITBOXES AUTOMATICALLY 🔥
        fetch('Globals/LMS_Master_html.html')
            .then(response => response.text())
            .then(html => {
                // Append the fetched buttons to the wrapper
                hitboxWrapper.insertAdjacentHTML('beforeend', html);
                
                // Now that the hitboxes exist, start the simulator!
                initializeSimulator();
            })
            .catch(error => {
                console.error("Error loading hitboxes:", error);
                instructionText.innerHTML = "<strong>Error:</strong> Could not load hitboxes. Check console.";
            });

        function initializeSimulator() {
            // Add event listeners to ALL hitboxes
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.addEventListener('click', function(e) {
                    // If they clicked the correct one...
                    if (this.id === sequence[currentStep].activeHitbox) {
                        errorMsg.style.display = 'none'; // Hide any previous error
                        currentStep++; // Move to next step
                        loadStep(currentStep); // Load it
                    } 
                });
            });

            // Add a click listener to the image itself to catch WRONG clicks
            posImage.addEventListener('click', function() {
                errorMsg.style.display = 'block';
            });

            // Start the first step
            loadStep(0);
        }

        function loadStep(stepIndex) {
            if (stepIndex >= sequence.length) {
                instructionText.innerHTML = "<strong>🎉 Simulation Complete!</strong><br><br>You've successfully completed this module.";
                posImage.src = "";
                document.querySelectorAll('.hitbox').forEach(hb => hb.style.display = 'none');
                return;
            }

            const stepData = sequence[stepIndex];
            
            // 1. Update Image
            posImage.src = stepData.image;
            
            // 2. Update Instructions
            instructionText.innerHTML = stepData.instruction;
            
            // 3. Hide all hitboxes
            document.querySelectorAll('.hitbox').forEach(hb => {
                hb.style.display = 'none';
            });
            
            // 4. Show the active hitbox and handle the arrow
            const activeHb = document.getElementById(stepData.activeHitbox);
            if (activeHb) {
                activeHb.style.display = 'block';

                // Ensure it's NEVER flipped in Stage 1.1
                activeHb.classList.remove('arrow-bottom'); 

                // Hide arrows starting at Step 39
                if (stepIndex >= 39) { 
                    activeHb.classList.add('hide-arrow'); 
                } else {
                    activeHb.classList.remove('hide-arrow'); // Keep visible before 39
                }
            } else {
                console.warn("Hitbox not found: " + stepData.activeHitbox);
            }
        }
            function goBack() {
            if (currentStep > 0) {
                currentStep--;
                loadStep(currentStep);
            }        
        }

            function goNext() {
            if (currentStep < sequence.length - 1) {
                currentStep++;
                loadStep(currentStep);
            }
        }
